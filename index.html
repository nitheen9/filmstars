<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FilmStars</title>

    <meta name="description"
          content="FilmStars - Movies, celebrities, entertainment news and updates.">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        main {
            padding: 50px 0;
        }

        .hero {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        .hero h1 {
            margin-top: 0;
            font-size: 40px;
        }

        .hero p {
            color: #666;
            font-size: 18px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

    </style>
</head>

<body>

<header>

    <div class="container">

        <div class="logo">
            FilmStars
        </div>

    </div>

</header>


<main>

    <div class="container">

        <section class="hero">

            <h1>
                Welcome to FilmStars
            </h1>

            <p>
                Movies, celebrities, entertainment news
                and latest updates.
            </p>

        </section>

    </div>

</main>


<footer>

    <div class="container">

        © <span id="year"></span> FilmStars

    </div>

</footer>


<script>

document.getElementById("year").textContent =
    new Date().getFullYear();

</script>

</body>
</html>
