<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Filmstars
</title>

<meta
    name="description"
    content="Latest film stars and celebrity posts."
>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f6f8;

    color: #222;

}


.header {

    background: #fe5301;

    color: white;

}


.header-inner {

    width: 92%;

    max-width: 1200px;

    min-height: 68px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.logo {

    font-size: 48px;

    font-weight: bold;

}


.nav a {

    color: white;

    text-decoration: none;

    margin-left: 22px;

}


.hero {

    width: 92%;

    max-width: 1200px;

    margin:
        40px auto 30px;

}


.hero h1 {

    margin:
        0 0 10px;

    font-size: 40px;

}


.hero p {

    margin: 0;

    color: #666;

    font-size: 17px;

}


.container {

    width: 92%;

    max-width: 1200px;

    margin:
        0 auto 70px;

}
.title-wrap {
  
    width: 100%;
    height: 40px;
    background-color: #47164F;   
    margin: 25px 0 25px;
}


.section-title {
   
    height: 40px;   
    color: #ffffff;
    text-transform: uppercase;
    line-height: 40px;
    padding: 0 15px;  
    font-size: 16px;
    margin: 25px 0 25px;

}


.posts-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 24px;

}


.post-card {

    overflow: hidden;

    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 12px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.05);

    transition:
        transform .15s ease,
        box-shadow .15s ease;

}


.post-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.10);

}


.post-image-link {

    display: block;

    background: #47164F;

}


.post-image {

    width: 100%;

    height: 360px;

    display: block;

    object-fit: fill;

    background: #f1f1f1;

}


.post-content {

    padding: 18px;

}


.post-title {

    margin:
        0 0 10px;

    font-size: 20px;

    line-height: 1.4;

}


.post-title a {

    color: #222;

    text-decoration: none;

}


.post-date {

    color: #777;

    font-size: 13px;

    margin-bottom: 12px;

}


.post-excerpt {

    color: #555;

    line-height: 1.6;

    font-size: 14px;

    margin-bottom: 15px;

}


.read-more {

    display: inline-block;

    padding:
        8px 13px;

    border-radius: 5px;

    background: #2563eb;

    color: white;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;

}


.loading {

    text-align: center;

    padding: 50px 10px;

    color: #666;

}


.error {

    background: white;

    padding: 25px;

    border-radius: 10px;

    border:
        1px solid #fecaca;

    color: #b91c1c;

}


.view-blog {

    text-align: center;

    margin-top: 35px;

}


.view-blog a {

    display: inline-block;

    background: #47164F;

    color: white;

    text-decoration: none;

    padding:
        11px 20px;

    border-radius: 6px;

    font-weight: bold;

}


.footer {

    background: #111827;

    color: #aaa;

    text-align: center;

    padding:
        30px 15px;

}


@media (
    max-width: 900px
) {

    .posts-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


@media (
    max-width: 600px
) {

    .header-inner {

        padding:
            17px 0;

        flex-direction:
            column;

        gap: 14px;

    }


    .nav a {

        margin:
            0 8px;

    }


    .hero h1 {

        font-size: 30px;

    }


    .posts-grid {

        grid-template-columns:
            1fr;

    }


    .post-image {

        height: auto;

        max-height: 700px;

    }

}

</style>

</head>


<body>


<header class="header">

<div class="header-inner">


<div class="logo">
Film Stars
</div>


<nav class="nav">

<a href="/">
Home
</a>

<a href="/blog">
Blog
</a>

</nav>


</div>

</header>

<!-- 
<section class="hero">

<h1>
Filmstars
</h1>


<p>
Latest celebrity and filmstar posts
</p>

</section>
-->

<main class="container">

<div class="title-wrap">
<h2 class="section-title">
Latest Posts
</h2>
</div>

<div
    id="posts"
    class="posts-grid"
>

<div class="loading">
Loading posts...
</div>

</div>


<div class="view-blog">

<a href="/blog">
View All Posts →
</a>

</div>


</main>


<footer class="footer">

© <span id="year"></span> Filmstars

</footer>


<script>

const API =
    "/api/blogger";


const POSTS_TO_SHOW =
    16;


const postsContainer =
    document.getElementById(
        "posts"
    );


document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();


// ======================================================
// ESCAPE
// ======================================================

function escapeHtml(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


// ======================================================
// DATE
// ======================================================

function formatDate(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


// ======================================================
// EXCERPT
// ======================================================

function getExcerpt(
    html,
    max = 130
) {

    if (!html) {
        return "";
    }


    const div =
        document.createElement(
            "div"
        );


    div.innerHTML =
        html;


    const text =
        div.textContent ||
        div.innerText ||
        "";


    const clean =
        text
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    if (
        clean.length <= max
    ) {

        return clean;
    }


    return (
        clean.substring(
            0,
            max
        ).trim() +
        "..."
    );
}


// ======================================================
// CARD
// ======================================================

function createCard(post) {

    const title =
        escapeHtml(
            post.title
        );


    const url =
        escapeHtml(
            post.url
        );


    const image =
        post.image
            ? escapeHtml(
                post.image
            )
            : "";


    const date =
        escapeHtml(
            formatDate(
                post.published
            )
        );


    const excerpt =
        escapeHtml(
            getExcerpt(
                post.content
            )
        );


    return `

        <article class="post-card">


            <a
                class="post-image-link"
                href="${url}"
            >

                ${
                    image
                        ? `

                            <img
                                class="post-image"
                                src="${image}"
                                alt="${title}"
                                loading="lazy"
                            >

                          `
                        : ""
                }

            </a>


            <div class="post-content">


                <h2 class="post-title">

                    <a
                        href="${url}"
                    >

                        ${title}

                    </a>

                </h2>


                <div class="post-date">

                    ${date}

                </div>


                <div class="post-excerpt">

                    ${excerpt}

                </div>


                <a
                    class="read-more"
                    href="${url}"
                >
                    Read More
                </a>


            </div>


        </article>

    `;
}


// ======================================================
// LOAD HOMEPAGE POSTS
// ======================================================

async function loadPosts() {

    postsContainer.innerHTML = `

        <div class="loading">

            Loading posts...

        </div>

    `;


    try {

        const response =
            await fetch(

                `${API}` +
                `?start-index=1` +
                `&max-results=${POSTS_TO_SHOW}`,

                {
                    cache:
                        "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to load posts"
            );

        }


        const posts =
            Array.isArray(
                data.posts
            )
                ? data.posts
                : [];


        if (
            posts.length === 0
        ) {

            postsContainer.innerHTML = `

                <div class="loading">

                    No posts found.

                </div>

            `;


            return;
        }


        postsContainer.innerHTML =
            posts
                .map(
                    createCard
                )
                .join("");


    } catch (error) {

        console.error(
            "Filmstars error:",
            error
        );


        postsContainer.innerHTML = `

            <div class="error">

                <strong>
                    Unable to load posts right now.
                </strong>

                <br><br>

                Please try again later.

                <br><br>

                <button
                    onclick="loadPosts()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


loadPosts();

</script>


</body>

</html>
