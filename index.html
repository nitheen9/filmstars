<section class="latest-blog-posts">

    <div class="blog-container">

        <div class="blog-heading">

            <h2>
                Latest Tollywood Posts
            </h2>

            <p>
                Latest movie news, celebrity updates
                and entertainment stories from Tollywood Boost.
            </p>

        </div>


        <div id="home-blog-loading">
            Loading latest posts...
        </div>


        <div id="home-blog-error"
             style="display:none;">
        </div>


        <div id="home-blog-posts"
             class="home-blog-grid">
        </div>


        <div class="home-blog-button">

            <a href="/blog">
                View All Posts
            </a>

        </div>

    </div>

</section>


<style>

.latest-blog-posts {
    padding: 50px 20px;
    background: #f5f7fb;
}

.blog-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
}

.blog-heading {
    text-align: center;
    margin-bottom: 30px;
}

.blog-heading h2 {
    margin: 0 0 10px;
    font-size: 32px;
}

.blog-heading p {
    margin: 0 auto;
    max-width: 700px;
    color: #666;
    line-height: 1.6;
}

.home-blog-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.home-blog-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.home-blog-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
}

.home-blog-content {
    padding: 18px;
}

.home-blog-content h3 {
    margin: 0 0 10px;
    font-size: 19px;
    line-height: 1.4;
}

.home-blog-content h3 a {
    color: #222;
    text-decoration: none;
}

.home-blog-content h3 a:hover {
    color: #2563eb;
}

.home-blog-date {
    font-size: 13px;
    color: #777;
    margin-bottom: 10px;
}

.home-blog-excerpt {
    color: #555;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 15px;
}

.home-blog-read {
    display: inline-block;
    padding: 9px 14px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}

.home-blog-button {
    text-align: center;
    margin-top: 30px;
}

.home-blog-button a {
    display: inline-block;
    padding: 12px 22px;
    background: #111827;
    color: white;
    text-decoration: none;
    border-radius: 7px;
}

@media (max-width: 900px) {

    .home-blog-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .home-blog-grid {
        grid-template-columns: 1fr;
    }

    .blog-heading h2 {
        font-size: 27px;
    }

}

</style>


<script>

(function () {

    const loading =
        document.getElementById(
            "home-blog-loading"
        );

    const error =
        document.getElementById(
            "home-blog-error"
        );

    const container =
        document.getElementById(
            "home-blog-posts"
        );


    function escapeHtml(value) {

        if (!value) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(dateString) {

        if (!dateString) {
            return "";
        }

        const date =
            new Date(dateString);

        if (isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleDateString(
            "en-IN",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

    }


    function createCard(post) {

        const title =
            escapeHtml(post.title);

        const url =
            escapeHtml(post.url || "#");

        const image =
            escapeHtml(post.image || "");

        const excerpt =
            escapeHtml(post.excerpt || "");

        const date =
            formatDate(post.published);


        return `

            <article class="home-blog-card">

                ${
                    image
                    ? `
                        <img
                            src="${image}"
                            alt="${title}"
                            loading="lazy"
                            onerror="this.style.display='none';"
                        >
                      `
                    : ""
                }

                <div class="home-blog-content">

                    <h3>

                        <a
                            href="${url}"
                            target="_blank"
                            rel="noopener"
                        >
                            ${title}
                        </a>

                    </h3>


                    ${
                        date
                        ? `
                            <div class="home-blog-date">
                                ${date}
                            </div>
                          `
                        : ""
                    }


                    <div class="home-blog-excerpt">
                        ${excerpt}
                    </div>


                    <a
                        class="home-blog-read"
                        href="${url}"
                        target="_blank"
                        rel="noopener"
                    >
                        Read More
                    </a>

                </div>

            </article>

        `;

    }


    async function loadHomePosts() {

        try {

            const response =
                await fetch(
                    "/blogger-posts"
                );


            if (!response.ok) {
                throw new Error(
                    "Blogger API failed"
                );
            }


            const data =
                await response.json();


            loading.style.display =
                "none";


            if (
                !data.success ||
                !Array.isArray(data.posts)
            ) {

                throw new Error(
                    "Invalid Blogger data"
                );

            }


            /*
             * Homepage shows only 6 posts.
             */
            const posts =
                data.posts.slice(0, 6);


            container.innerHTML =
                posts
                    .map(createCard)
                    .join("");


        } catch (e) {

            console.error(e);

            loading.style.display =
                "none";

            error.textContent =
                "Latest posts are temporarily unavailable.";

            error.style.display =
                "block";

        }

    }


    loadHomePosts();

})();

</script>
