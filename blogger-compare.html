<body>


<header>

<p>

</p>

</header>


<div class="container">


<div class="controls">


<button
    id="startButton"
    onclick="startComparison()"
>

Check All Posts

</button>

    class="download"
    onclick="downloadCSV()"

>

Download CSV

</button>

Ready.

<div id="progressBar"></div>

</div>

    id="summary"
    class="summary"

>


<div class="card">

<strong id="abcCount">
0
</strong>

<span>
TollywoodBoost Posts
</span>

</div>


<div class="card">

<strong id="xyzCount">
0
</strong>

<span>
TollyBoost Posts
</span>

</div>


<div class="card">

<strong id="duplicateCount">
0
</strong>

<span>
Duplicates
</span>

</div>


<div class="card">

<strong id="notFound">
0
</strong>

<span>
Not Found
</span>

</div>


</div>

<div class="empty">

Click
<strong>
Check All Posts
</strong>

to compare the two Blogger blogs.

</div>

</div>

<script>


const BATCH_SIZE = 500;


let abcPosts = [];

let xyzPosts = [];

let duplicateResults = [];


/* =========================================
START
========================================= */

async function startComparison() {


    const startButton =
        document.getElementById(
            "startButton"
        );


    const downloadButton =
        document.getElementById(
            "downloadButton"
        );


    startButton.disabled =
        true;


    downloadButton.disabled =
        true;


    abcPosts = [];

    xyzPosts = [];

    duplicateResults = [];


    document.getElementById(
        "results"
    ).innerHTML = "";


    try {


        /*
         * ABC
         */

        abcPosts =
            await loadAllPosts(
                "abc"
            );


        /*
         * XYZ
         */

        xyzPosts =
            await loadAllPosts(
                "xyz"
            );


        document.getElementById(
            "abcCount"
        ).textContent =
            abcPosts.length
                .toLocaleString();


        document.getElementById(
            "xyzCount"
        ).textContent =
            xyzPosts.length
                .toLocaleString();


        document.getElementById(
            "summary"
        ).style.display =
            "grid";


        /*
         * Create ABC indexes.
         */

        setStatus(
            "Creating search indexes..."
        );


        const indexes =
            createIndexes(
                abcPosts
            );


        /*
         * Compare.
         */

        duplicateResults =
            comparePosts(
                xyzPosts,
                indexes
            );


        document.getElementById(
            "duplicateCount"
        ).textContent =
            duplicateResults.length
                .toLocaleString();


        document.getElementById(
            "notFound"
        ).textContent =
            (
                xyzPosts.length -
                duplicateResults.length
            ).toLocaleString();


        displayResults();


        downloadButton.disabled =
            duplicateResults.length === 0;


        setProgress(100);


        setStatus(
            "Finished. " +
            duplicateResults.length
                .toLocaleString() +
            " duplicate posts found."
        );


    }
    catch(error) {


        console.error(error);


        setStatus(
            "ERROR: " +
            error.message
        );


    }
    finally {

        startButton.disabled =
            false;
    }
}


/* =========================================
LOAD BLOGGER POSTS
========================================= */

async function loadAllPosts(blog) {


    const allPosts = [];


    let start = 1;


    while(true) {


        setStatus(
            "Downloading " +
            blog.toUpperCase() +
            " posts: " +
            allPosts.length
                .toLocaleString()
        );


        const apiUrl =
            "/api/blogger-posts" +
            "?blog=" +
            encodeURIComponent(blog) +
            "&start=" +
            start;


        const response =
            await fetch(
                apiUrl,
                {
                    cache:
                        "no-store"
                }
            );


        /*
         * Important:
         * Detect HTML response.
         */

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            !contentType
                .toLowerCase()
                .includes(
                    "application/json"
                )
        ) {


            const text =
                await response.text();


            throw new Error(
                "The API returned HTML instead of JSON. " +
                "HTTP " +
                response.status +
                ". " +
                text.substring(
                    0,
                    120
                )
            );
        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "API request failed."
            );
        }


        if (
            data.success !== true
        ) {

            throw new Error(
                data.error ||
                "Blogger API failed."
            );
        }


        const posts =
            data.posts || [];


        if (
            posts.length === 0
        ) {

            break;
        }


        allPosts.push(
            ...posts
        );


        /*
         * If less than 500,
         * Blogger has reached the end.
         */

        if (
            posts.length <
            BATCH_SIZE
        ) {

            break;
        }


        start +=
            BATCH_SIZE;


        await sleep(300);
    }


    return allPosts;
}


/* =========================================
CREATE INDEXES
========================================= */

function createIndexes(posts) {


    const contentIndex =
        new Map();


    const titleDateIndex =
        new Map();


    const titleIndex =
        new Map();


    for (
        const post
        of posts
    ) {


        const contentKey =
            normalizeContent(
                post.content
            );


        const titleKey =
            normalizeTitle(
                post.title
            );


        const dateKey =
            getDate(
                post.published
            );


        post.contentKey =
            hash(
                contentKey
            );


        post.titleKey =
            titleKey;


        /*
         * Content
         */

        addToMap(
            contentIndex,
            post.contentKey,
            post
        );


        /*
         * Title
         */

        addToMap(
            titleIndex,
            titleKey,
            post
        );


        /*
         * Title + date
         */

        addToMap(
            titleDateIndex,

            titleKey +
            "|" +
            dateKey,

            post
        );
    }


    return {

        contentIndex,

        titleDateIndex,

        titleIndex
    };
}


/* =========================================
COMPARE
========================================= */

function comparePosts(
    posts,
    indexes
) {


    const results = [];


    for (
        let i = 0;
        i < posts.length;
        i++
    ) {


        const xyz =
            posts[i];


        /*
         * 1. Exact normalized content.
         */

        const contentKey =
            hash(
                normalizeContent(
                    xyz.content
                )
            );


        const exactContent =
            indexes.contentIndex.get(
                contentKey
            );


        if (
            exactContent &&
            exactContent.length
        ) {


            results.push({

                xyz: xyz,

                abc:
                    exactContent[0],

                method:
                    "EXACT CONTENT",

                confidence:
                    "100%"
            });


            updateProgress(
                i,
                posts.length
            );


            continue;
        }


        /*
         * 2. Title + date.
         */

        const titleKey =
            normalizeTitle(
                xyz.title
            );


        const date =
            getDate(
                xyz.published
            );


        const titleDate =
            indexes.titleDateIndex.get(
                titleKey +
                "|" +
                date
            );


        if (
            titleDate &&
            titleDate.length === 1
        ) {


            results.push({

                xyz: xyz,

                abc:
                    titleDate[0],

                method:
                    "TITLE + DATE",

                confidence:
                    "98%"
            });


            updateProgress(
                i,
                posts.length
            );


            continue;
        }


        /*
         * 3. Exact title.
         */

        const exactTitle =
            indexes.titleIndex.get(
                titleKey
            );


        if (
            exactTitle &&
            exactTitle.length === 1
        ) {


            results.push({

                xyz: xyz,

                abc:
                    exactTitle[0],

                method:
                    "EXACT TITLE",

                confidence:
                    "95%"
            });


            updateProgress(
                i,
                posts.length
            );


            continue;
        }


        updateProgress(
            i,
            posts.length
        );
    }


    return results;
}


/* =========================================
DISPLAY
========================================= */

function displayResults() {


    const container =
        document.getElementById(
            "results"
        );


    if (
        duplicateResults.length === 0
    ) {


        container.innerHTML = `

<div class="empty">

No duplicate posts found.

</div>

`;

        return;
    }


    /*
     * Display first 200.
     *
     * CSV contains all.
     */

    const limit =
        Math.min(
            duplicateResults.length,
            200
        );


    let html = "";


    for (
        let i = 0;
        i < limit;
        i++
    ) {

        html +=
            renderMatch(
                duplicateResults[i],
                i + 1
            );
    }


    if (
        duplicateResults.length >
        200
    ) {

        html += `

<div class="empty">

Showing first 200 matches.

<br><br>

Total duplicates:

<strong>
${duplicateResults.length
    .toLocaleString()}
</strong>

<br><br>

Download CSV to get every match.

</div>

`;
    }


    container.innerHTML =
        html;
}


/* =========================================
RENDER MATCH
========================================= */

function renderMatch(
    match,
    number
) {


    return `

<div class="match">


<div class="match-header">

Duplicate #${number}

&nbsp; | &nbsp;

${escapeHtml(
    match.method
)}

&nbsp; | &nbsp;

${escapeHtml(
    match.confidence
)}

</div>


<div class="columns">


<!-- XYZ -->

<div class="column">


<h2>
XYZ — TollyBoost
</h2>


<div class="title">

${escapeHtml(
    match.xyz.title
)}

</div>


<div class="date">

Published:

${escapeHtml(
    match.xyz.published
)}

</div>


<div class="url">

<strong>
XYZ URL
</strong>

<br><br>

<a
href="${escapeAttr(
    match.xyz.url
)}"
target="_blank"
rel="noopener">

${escapeHtml(
    match.xyz.url
)}

</a>

</div>


${renderImages(
    match.xyz.images
)}


<h3>
XYZ Post HTML
</h3>


<pre>${escapeHtml(
    match.xyz.content
)}</pre>


</div>


<!-- ABC -->

<div class="column">


<h2>
ABC — TollywoodBoost
</h2>


<div class="title">

${escapeHtml(
    match.abc.title
)}

</div>


<div class="date">

Published:

${escapeHtml(
    match.abc.published
)}

</div>


<div class="url">

<strong>
ABC URL
</strong>

<br><br>

<a
href="${escapeAttr(
    match.abc.url
)}"
target="_blank"
rel="noopener">

${escapeHtml(
    match.abc.url
)}

</a>

</div>


${renderImages(
    match.abc.images
)}


<h3>
ABC Post HTML
</h3>


<pre>${escapeHtml(
    match.abc.content
)}</pre>


</div>


</div>

</div>

`;
}


/* =========================================
IMAGES
========================================= */

function renderImages(
    images
) {


    if (
        !images ||
        images.length === 0
    ) {

        return `
<div class="images">
No images detected.
</div>
`;
    }


    return `

<div class="images">

<h3>
Images (${images.length})
</h3>


${
    images.map(
        image => `

<div class="image">

<img
src="${escapeAttr(image)}"
loading="lazy"
onerror="
this.style.display='none';
"
>

<div class="image-url">

${escapeHtml(image)}

</div>

</div>

`
    ).join("")
}

</div>

`;
}


/* =========================================
CSV
========================================= */

function downloadCSV() {


    if (
        duplicateResults.length === 0
    ) {

        return;
    }


    const rows = [

        [
            "XYZ URL",
            "ABC URL",
            "XYZ Title",
            "ABC Title",
            "XYZ Published",
            "ABC Published",
            "Match Method",
            "Confidence"
        ]
    ];


    for (
        const match
        of duplicateResults
    ) {


        rows.push([

            match.xyz.url,

            match.abc.url,

            match.xyz.title,

            match.abc.title,

            match.xyz.published,

            match.abc.published,

            match.method,

            match.confidence
        ]);
    }


    const csv =
        rows
        .map(
            row =>
                row
                .map(
                    csvEscape
                )
                .join(",")
        )
        .join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "blogger-duplicates.csv";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================
CONTENT NORMALIZATION
========================================= */

function normalizeContent(
    html
) {


    let value =
        String(
            html || ""
        );


    /*
     * Remove scripts.
     */

    value =
        value.replace(
            /<script[\s\S]*?<\/script>/gi,
            ""
        );


    /*
     * Remove styles.
     */

    value =
        value.replace(
            /<style[\s\S]*?<\/style>/gi,
            ""
        );


    /*
     * Replace image tags
     * with normalized image filename.
     *
     * This is important because
     * Blogger may create different
     * image URLs in two blogs.
     */

    value =
        value.replace(
            /<img[^>]*>/gi,
            function(imageTag) {


                const match =
                    imageTag.match(
                        /(?:src|data-src)\s*=\s*["']([^"']+)["']/i
                    );


                if (!match) {

                    return "<image>";
                }


                const filename =
                    getImageFilename(
                        match[1]
                    );


                return (
                    "<image:" +
                    normalizeImageFilename(
                        filename
                    ) +
                    ">"
                );
            }
        );


    /*
     * Remove remaining HTML.
     */

    value =
        value.replace(
            /<[^>]+>/g,
            " "
        );


    /*
     * Decode common entities.
     */

    value =
        value
        .replace(
            /&nbsp;/gi,
            " "
        )
        .replace(
            /&amp;/gi,
            "&"
        )
        .replace(
            /&quot;/gi,
            '"'
        );


    /*
     * Normalize spaces.
     */

    value =
        value
        .toLowerCase()
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    return value;
}


/* =========================================
IMAGE FILENAME
========================================= */

function getImageFilename(
    url
) {


    try {


        const clean =
            url.split("?")[0];


        const parts =
            clean.split("/");


        return decodeURIComponent(
            parts[
                parts.length - 1
            ]
        );


    }
    catch {

        return url;
    }
}


function normalizeImageFilename(
    name
) {


    return String(
        name || ""
    )
    .toLowerCase()
    .replace(
        /\+/g,
        " "
    )
    .replace(
        /%20/g,
        " "
    )
    .replace(
        /%2520/g,
        " "
    )
    .replace(
        /%28/g,
        "("
    )
    .replace(
        /%29/g,
        ")"
    )
    .replace(
        /\s+/g,
        " "
    )
    .trim();
}


/* =========================================
TITLE
========================================= */

function normalizeTitle(
    title
) {


    return String(
        title || ""
    )
    .normalize("NFKC")
    .toLowerCase()
    .replace(
        /[^\p{L}\p{N}\s]/gu,
        " "
    )
    .replace(
        /\s+/g,
        " "
    )
    .trim();
}


/* =========================================
HASH
========================================= */

function hash(
    value
) {


    let h = 0;


    for (
        let i = 0;
        i < value.length;
        i++
    ) {

        h =
            (
                (h << 5) -
                h
            ) +
            value.charCodeAt(i);


        h |= 0;
    }


    return String(h);
}


/* =========================================
MAP
========================================= */

function addToMap(
    map,
    key,
    value
) {


    if (
        !map.has(key)
    ) {

        map.set(
            key,
            []
        );
    }


    map
        .get(key)
        .push(value);
}


/* =========================================
DATE
========================================= */

function getDate(
    value
) {


    if (!value) {
        return "";
    }


    return String(
        value
    ).substring(
        0,
        10
    );
}


/* =========================================
PROGRESS
========================================= */

function updateProgress(
    current,
    total
) {


    const percent =
        Math.round(
            (
                (current + 1) /
                total
            ) *
            100
        );


    setProgress(
        percent
    );


    setStatus(
        "Comparing XYZ posts: " +
        (current + 1)
            .toLocaleString() +
        " / " +
        total
            .toLocaleString()
    );
}


function setProgress(
    percent
) {


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";
}


function setStatus(
    text
) {


    document.getElementById(
        "status"
    ).textContent =
        text;
}


/* =========================================
ESCAPE
========================================= */

function escapeHtml(
    value
) {


    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttr(
    value
) {

    return escapeHtml(
        value
    );
}


function csvEscape(
    value
) {


    const text =
        String(
            value || ""
        );


    if (
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n") ||
        text.includes("\r")
    ) {

        return '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"';
    }


    return text;
}


/* =========================================
SLEEP
========================================= */

function sleep(
    milliseconds
) {


    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );
}
