<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Blogger Duplicate Post Finder
</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: #fe5301;
    color: white;
    padding: 25px 20px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

header p {
    margin: 0;
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 20px;
}

.controls {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

button {
    border: 0;
    border-radius: 6px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 8px;
    background: #fe5301;
    color: white;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.download {
    background: #198754;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}

.progress {
    margin-top: 15px;
    height: 20px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #fe5301;
    transition: width .2s;
}

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.card strong {
    display: block;
    font-size: 26px;
    margin-bottom: 5px;
}

.card span {
    color: #666;
    font-size: 13px;
}

.match {
    background: white;
    border-radius: 10px;
    margin-bottom: 25px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.match-header {
    background: #222;
    color: white;
    padding: 14px 18px;
    font-weight: bold;
}

.columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.column {
    padding: 20px;
    min-width: 0;
}

.column:first-child {
    border-right: 1px solid #ddd;
}

.column h2 {
    margin-top: 0;
}

.title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.date {
    color: #666;
    font-size: 13px;
    margin-bottom: 12px;
}

.url {
    background: #f1f1f1;
    padding: 10px;
    border-radius: 5px;
    font-size: 13px;
    word-break: break-all;
}

.url a {
    color: #06c;
}

.images {
    margin-top: 20px;
}

.image {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 15px;
}

.image img {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    display: block;
    background: #eee;
}

.image-url {
    margin-top: 8px;
    font-size: 10px;
    color: #555;
    word-break: break-all;
}

.empty {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 10px;
}

@media(max-width:900px) {

    .summary {
        grid-template-columns: repeat(2,1fr);
    }

    .columns {
        grid-template-columns: 1fr;
    }

    .column:first-child {
        border-right: 0;
        border-bottom: 1px solid #ddd;
    }
}

@media(max-width:550px) {

    .summary {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<header>

<h1>
Blogger Duplicate Post Finder
</h1>

<p>
TollywoodBoost ↔ TollyBoost
</p>

</header>

<div class="container">

<div class="controls">

<button
    id="startButton"
    onclick="startComparison()"
>
Check All Posts
</button>

<button
    id="downloadButton"
    class="download"
    onclick="downloadCSV()"
    disabled
>
Download CSV
</button>

<div id="status">
Ready.
</div>

<div class="progress">

<div id="progressBar"></div>

</div>

</div>


<div
    id="summary"
    class="summary"
    style="display:none;"
>

<div class="card">
<strong id="abcCount">0</strong>
<span>TollywoodBoost Posts</span>
</div>

<div class="card">
<strong id="xyzCount">0</strong>
<span>TollyBoost Posts</span>
</div>

<div class="card">
<strong id="duplicateCount">0</strong>
<span>Duplicates</span>
</div>

<div class="card">
<strong id="notFound">0</strong>
<span>Not Found</span>
</div>

</div>


<div id="results">

<div class="empty">

Click
<strong>Check All Posts</strong>
to compare the two Blogger blogs.

</div>

</div>

</div>


<script>

const BATCH_SIZE = 150;

let abcPosts = [];
let xyzPosts = [];
let duplicateResults = [];


/* =========================================
   START
========================================= */

async function startComparison() {

    const startButton =
        document.getElementById("startButton");

    const downloadButton =
        document.getElementById("downloadButton");

    startButton.disabled = true;
    downloadButton.disabled = true;

    abcPosts = [];
    xyzPosts = [];
    duplicateResults = [];

    document.getElementById("results").innerHTML = "";

    try {

        abcPosts =
            await loadAllPosts(
                "tollywoodboost"
            );

        document.getElementById("abcCount").textContent =
            abcPosts.length.toLocaleString();

        document.getElementById("summary").style.display =
            "grid";


        xyzPosts =
            await loadAllPosts(
                "tollyboost"
            );

        document.getElementById("xyzCount").textContent =
            xyzPosts.length.toLocaleString();


        setStatus(
            "Creating duplicate indexes..."
        );


        const indexes =
            createIndexes(abcPosts);


        duplicateResults =
            comparePosts(
                xyzPosts,
                indexes
            );


        document.getElementById(
            "duplicateCount"
        ).textContent =
            duplicateResults.length.toLocaleString();


        document.getElementById(
            "notFound"
        ).textContent =
            (
                xyzPosts.length -
                duplicateResults.length
            ).toLocaleString();


        displayResults();


        downloadButton.disabled =
            duplicateResults.length === 0;


        setProgress(100);


        setStatus(
            "Finished. " +
            duplicateResults.length.toLocaleString() +
            " duplicate posts found."
        );

    }
    catch(error) {

        console.error(error);

        setStatus(
            "ERROR: " +
            error.message
        );

    }
    finally {

        startButton.disabled = false;
    }
}


/* =========================================
   LOAD ALL POSTS
========================================= */

async function loadAllPosts(blog) {

    const allPosts = [];

    let start = 1;

    while(true) {

        setStatus(
            "Downloading " +
            blog +
            " posts: " +
            allPosts.length.toLocaleString()
        );


        const apiUrl =
            "/api/blogger-posts" +
            "?blog=" +
            encodeURIComponent(blog) +
            "&start=" +
            start;


        const response =
            await fetch(
                apiUrl,
                {
                    cache: "no-store"
                }
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            !contentType
                .toLowerCase()
                .includes("application/json")
        ) {

            const text =
                await response.text();

            throw new Error(
                "API returned HTML instead of JSON. " +
                "HTTP " +
                response.status +
                ". Response begins: " +
                text.substring(0,150)
            );
        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "API request failed."
            );
        }


        if (data.success !== true) {

            throw new Error(
                data.error ||
                "Blogger API failed."
            );
        }


        const posts =
            data.posts || [];


        /*
         * THIS is the important change.
         *
         * Do NOT stop because the batch
         * contains fewer than 150.
         *
         * Only stop when Blogger returns
         * ZERO posts.
         */

        if (posts.length === 0) {
            break;
        }


        allPosts.push(...posts);


        /*
         * Continue using the actual
         * number returned.
         */

        start += posts.length;


        /*
         * Safety protection.
         */

        if (start > 100000) {

            throw new Error(
                "Safety limit reached at 100,000 posts."
            );
        }


        await sleep(250);
    }


    return allPosts;
}


/* =========================================
   CREATE INDEXES
========================================= */

function createIndexes(posts) {

    const byTitle =
        new Map();

    const byImages =
        new Map();

    const byText =
        new Map();


    for(const post of posts) {

        const title =
            post.titleKey || "";


        const text =
            post.textKey || "";


        addMap(
            byTitle,
            title,
            post
        );


        /*
         * Use image filenames as
         * another identity.
         */

        const images =
            [...(post.imageKeys || [])]
                .sort()
                .join("|");


        if(images) {

            addMap(
                byImages,
                images,
                post
            );
        }


        /*
         * Full normalized text.
         */

        if(text) {

            addMap(
                byText,
                text,
                post
            );
        }
    }


    return {
        byTitle,
        byImages,
        byText
    };
}


/* =========================================
   COMPARE
========================================= */

function comparePosts(
    posts,
    indexes
) {

    const results = [];

    const alreadyMatched =
        new Set();


    for(
        let i = 0;
        i < posts.length;
        i++
    ) {

        const xyz =
            posts[i];


        /*
         * 1. Exact normalized text.
         */

        const textMatches =
            indexes.byText.get(
                xyz.textKey
            );


        if(
            textMatches &&
            textMatches.length
        ) {

            const abc =
                chooseBestMatch(
                    textMatches,
                    xyz
                );


            if(abc) {

                addResult(
                    results,
                    alreadyMatched,
                    xyz,
                    abc,
                    "EXACT NORMALIZED TEXT",
                    "100%"
                );

                continue;
            }
        }


        /*
         * 2. Same title + same
         * image filenames.
         */

        const imageKey =
            [...(xyz.imageKeys || [])]
                .sort()
                .join("|");


        if(imageKey) {

            const imageMatches =
                indexes.byImages.get(
                    imageKey
                );


            if(
                imageMatches &&
                imageMatches.length
            ) {

                const abc =
                    chooseBestMatch(
                        imageMatches,
                        xyz
                    );


                if(abc) {

                    addResult(
                        results,
                        alreadyMatched,
                        xyz,
                        abc,
                        "SAME IMAGE FILENAMES",
                        "99%"
                    );

                    continue;
                }
            }
        }


        /*
         * 3. Exact normalized title.
         */

        const titleMatches =
            indexes.byTitle.get(
                xyz.titleKey
            );


        if(
            titleMatches &&
            titleMatches.length
        ) {

            const abc =
                chooseBestMatch(
                    titleMatches,
                    xyz
                );


            if(abc) {

                addResult(
                    results,
                    alreadyMatched,
                    xyz,
                    abc,
                    "EXACT TITLE",
                    "95%"
                );

                continue;
            }
        }
    }


    return results;
}


/* =========================================
   BEST MATCH
========================================= */

function chooseBestMatch(
    candidates,
    xyz
) {

    if(
        !candidates ||
        candidates.length === 0
    ) {
        return null;
    }


    /*
     * Prefer same publication date.
     */

    const xyzDate =
        getDate(xyz.published);


    const sameDate =
        candidates.find(
            x =>
                getDate(
                    x.published
                ) === xyzDate
        );


    if(sameDate) {
        return sameDate;
    }


    return candidates[0];
}


/* =========================================
   ADD RESULT
========================================= */

function addResult(
    results,
    alreadyMatched,
    xyz,
    abc,
    method,
    confidence
) {

    const key =
        abc.id +
        "|" +
        xyz.id;


    if(
        alreadyMatched.has(key)
    ) {
        return;
    }


    alreadyMatched.add(key);


    results.push({

        abc,
        xyz,
        method,
        confidence
    });
}


/* =========================================
   DISPLAY
========================================= */

function displayResults() {

    const container =
        document.getElementById(
            "results"
        );


    if(
        duplicateResults.length === 0
    ) {

        container.innerHTML = `

<div class="empty">

No duplicate posts found.

</div>

`;

        return;
    }


    /*
     * Display first 200.
     * CSV contains all.
     */

    const limit =
        Math.min(
            duplicateResults.length,
            200
        );


    let html = "";


    for(
        let i = 0;
        i < limit;
        i++
    ) {

        html +=
            renderMatch(
                duplicateResults[i],
                i + 1
            );
    }


    if(
        duplicateResults.length > 200
    ) {

        html += `

<div class="empty">

Showing first 200 matches.

<br><br>

Total:

<strong>
${duplicateResults.length.toLocaleString()}
</strong>

<br><br>

Use Download CSV for every match.

</div>

`;
    }


    container.innerHTML =
        html;
}


/* =========================================
   RENDER MATCH
========================================= */

function renderMatch(
    match,
    number
) {

    return `

<div class="match">

<div class="match-header">

Duplicate #${number}

&nbsp; | &nbsp;

${escapeHtml(match.method)}

&nbsp; | &nbsp;

${escapeHtml(match.confidence)}

</div>


<div class="columns">


<div class="column">

<h2>
XYZ — TollyBoost
</h2>

<div class="title">

${escapeHtml(
    match.xyz.title
)}

</div>

<div class="date">

Published:
${escapeHtml(
    match.xyz.published
)}

</div>

<div class="url">

<strong>
XYZ URL
</strong>

<br><br>

<a
href="${escapeAttr(
    match.xyz.url
)}"
target="_blank"
rel="noopener">

${escapeHtml(
    match.xyz.url
)}

</a>

</div>

${renderImages(
    match.xyz.images
)}

</div>


<div class="column">

<h2>
ABC — TollywoodBoost
</h2>

<div class="title">

${escapeHtml(
    match.abc.title
)}

</div>

<div class="date">

Published:
${escapeHtml(
    match.abc.published
)}

</div>

<div class="url">

<strong>
ABC URL
</strong>

<br><br>

<a
href="${escapeAttr(
    match.abc.url
)}"
target="_blank"
rel="noopener">

${escapeHtml(
    match.abc.url
)}

</a>

</div>

${renderImages(
    match.abc.images
)}

</div>


</div>

</div>

`;
}


/* =========================================
   RENDER IMAGES
========================================= */

function renderImages(images) {

    if(
        !images ||
        images.length === 0
    ) {

        return "";
    }


    return `

<div class="images">

<h3>
Images (${images.length})
</h3>

${
    images.map(
        image => `

<div class="image">

<img
src="${escapeAttr(
    image
)}"
loading="lazy"
onerror="
this.style.display='none';
"
>

<div class="image-url">

${escapeHtml(image)}

</div>

</div>

`
    ).join("")
}

</div>

`;
}


/* =========================================
   CSV
========================================= */

function downloadCSV() {

    if(
        duplicateResults.length === 0
    ) {
        return;
    }


    const rows = [

        [
            "XYZ URL",
            "ABC URL",
            "XYZ Title",
            "ABC Title",
            "XYZ Published",
            "ABC Published",
            "Match Method",
            "Confidence"
        ]
    ];


    for(
        const match
        of duplicateResults
    ) {

        rows.push([

            match.xyz.url,

            match.abc.url,

            match.xyz.title,

            match.abc.title,

            match.xyz.published,

            match.abc.published,

            match.method,

            match.confidence
        ]);
    }


    const csv =
        rows
            .map(
                row =>
                    row
                        .map(csvEscape)
                        .join(",")
            )
            .join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href = url;

    a.download =
        "blogger-duplicate-posts.csv";


    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}


/* =========================================
   MAP
========================================= */

function addMap(
    map,
    key,
    post
) {

    if(!key) {
        return;
    }


    if(!map.has(key)) {

        map.set(
            key,
            []
        );
    }


    map.get(key).push(post);
}


/* =========================================
   DATE
========================================= */

function getDate(value) {

    if(!value) {
        return "";
    }


    return String(value)
        .substring(0,10);
}


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

    document.getElementById(
        "status"
    ).textContent =
        text;
}


/* =========================================
   PROGRESS
========================================= */

function setProgress(value) {

    document.getElementById(
        "progressBar"
    ).style.width =
        value + "%";
}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeAttr(value) {

    return escapeHtml(value);
}


/* =========================================
   CSV ESCAPE
========================================= */

function csvEscape(value) {

    const text =
        String(value || "");


    if(
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n") ||
        text.includes("\r")
    ) {

        return '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"';
    }


    return text;
}


/* =========================================
   SLEEP
========================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}

</script>

</body>
