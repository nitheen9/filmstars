<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Blogger Duplicate Finder</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #fe5301;
    color: white;
    padding: 25px 20px;
}

header h1 {
    margin: 0 0 8px;
}

header p {
    margin: 0;
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 20px;
}

.controls {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

button {
    background: #fe5301;
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 13px 20px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 8px;
}

button:disabled {
    background: #999;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}

.progress {
    margin-top: 12px;
    height: 20px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #fe5301;
}

.summary {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.card strong {
    display: block;
    font-size: 25px;
}

.card span {
    color: #666;
}

.match {
    background: white;
    margin-bottom: 25px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.match-header {
    background: #222;
    color: white;
    padding: 14px 18px;
    font-weight: bold;
}

.columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.column {
    padding: 20px;
}

.column:first-child {
    border-right: 1px solid #ddd;
}

.column h2 {
    margin-top: 0;
}

.title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.date {
    color: #666;
    font-size: 13px;
    margin-bottom: 12px;
}

.url {
    background: #f1f1f1;
    padding: 10px;
    border-radius: 5px;
    word-break: break-all;
    font-size: 13px;
}

.url a {
    color: #06c;
}

.images {
    margin-top: 20px;
}

.image {
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 15px;
    padding: 8px;
}

.image img {
    max-width: 100%;
    max-height: 350px;
    display: block;
    margin: auto;
}

.image-url {
    font-size: 10px;
    word-break: break-all;
    color: #555;
    margin-top: 8px;
}

pre {
    background: #111;
    color: #eee;
    padding: 15px;
    border-radius: 6px;
    overflow: auto;
    max-height: 400px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
}

@media(max-width: 900px) {

    .summary {
        grid-template-columns: 1fr 1fr;
    }

    .columns {
        grid-template-columns: 1fr;
    }

    .column:first-child {
        border-right: 0;
        border-bottom: 1px solid #ddd;
    }
}

</style>

</head>

<body>

<header>

<h1>Blogger Duplicate Finder</h1>

<p>
tollywoodboost.blogspot.com
&nbsp; ↔ &nbsp;
tollyboost.blogspot.com
</p>

</header>


<div class="container">


<div class="controls">

<button
    id="start"
    onclick="start()">

Check All Posts

</button>


<button
    id="csv"
    onclick="downloadCSV()"
    disabled>

Download CSV

</button>


<div
    id="status">

Ready.

</div>


<div class="progress">

<div id="progressBar"></div>

</div>

</div>


<div
    id="summary"
    class="summary"
    style="display:none;">

<div class="card">

<strong id="abcCount">
0
</strong>

<span>
ABC Posts
</span>

</div>


<div class="card">

<strong id="xyzCount">
0
</strong>

<span>
XYZ Posts
</span>

</div>


<div class="card">

<strong id="duplicateCount">
0
</strong>

<span>
Duplicates
</span>

</div>


<div class="card">

<strong id="notFound">
0
</strong>

<span>
XYZ Not Found
</span>

</div>

</div>


<div id="results"></div>


</div>


<script>

const BATCH = 500;

let abc = [];

let xyz = [];

let matches = [];


/* =====================================================
START
===================================================== */

async function start() {

    const button =
        document.getElementById("start");

    button.disabled = true;

    document.getElementById(
        "csv"
    ).disabled = true;

    document.getElementById(
        "results"
    ).innerHTML = "";

    abc = [];

    xyz = [];

    matches = [];

    try {

        /*
         * ABC
         */

        abc =
            await getAll("abc");


        /*
         * XYZ
         */

        xyz =
            await getAll("xyz");


        document.getElementById(
            "abcCount"
        ).textContent =
            abc.length.toLocaleString();


        document.getElementById(
            "xyzCount"
        ).textContent =
            xyz.length.toLocaleString();


        document.getElementById(
            "summary"
        ).style.display =
            "grid";


        /*
         * Create indexes.
         */

        setStatus(
            "Creating ABC indexes..."
        );


        const indexes =
            createIndexes(abc);


        /*
         * Compare.
         */

        setStatus(
            "Comparing posts..."
        );


        matches =
            compare(
                xyz,
                indexes
            );


        document.getElementById(
            "duplicateCount"
        ).textContent =
            matches.length.toLocaleString();


        document.getElementById(
            "notFound"
        ).textContent =
            (
                xyz.length -
                matches.length
            ).toLocaleString();


        displayMatches();


        document.getElementById(
            "csv"
        ).disabled =
            matches.length === 0;


        progress(100);


        setStatus(
            "Finished. " +
            matches.length.toLocaleString() +
            " duplicates found."
        );

    }
    catch(error) {

        console.error(error);

        setStatus(
            "ERROR: " +
            error.message
        );

    }

    button.disabled = false;
}


/* =====================================================
GET ALL
===================================================== */

async function getAll(blog) {

    const result = [];

    let start = 1;

    while(true) {

        setStatus(
            "Downloading " +
            blog.toUpperCase() +
            " posts: " +
            result.length.toLocaleString()
        );


        const response =
            await fetch(
                "/api/blogger-posts?blog=" +
                encodeURIComponent(blog) +
                "&start=" +
                start
            );


        /*
         * IMPORTANT:
         * Check content type before JSON.
         */

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if(
            !contentType
                .toLowerCase()
                .includes("application/json")
        ) {

            const text =
                await response.text();

            throw new Error(
                "Cloudflare Function did not return JSON. " +
                "HTTP " +
                response.status +
                ". Response begins: " +
                text.substring(0, 100)
            );
        }


        const data =
            await response.json();


        if(!response.ok) {

            throw new Error(
                data.error ||
                "API request failed."
            );
        }


        if(data.error) {

            throw new Error(
                data.error
            );
        }


        const posts =
            data.posts || [];


        if(posts.length === 0) {
            break;
        }


        result.push(...posts);


        if(posts.length < BATCH) {
            break;
        }


        start += BATCH;


        await sleep(300);
    }


    return result;
}


/* =====================================================
INDEXES
===================================================== */

function createIndexes(posts) {

    const content =
        new Map();

    const titleDate =
        new Map();

    const title =
        new Map();


    for(const post of posts) {

        const normalizedContent =
            normalizeContent(
                post.content
            );


        const contentKey =
            simpleHash(
                normalizedContent
            );


        const titleKey =
            normalizeTitle(
                post.title
            );


        const date =
            getDate(
                post.published
            );


        post.contentKey =
            contentKey;

        post.titleKey =
            titleKey;


        /*
         * Content
         */

        if(!content.has(contentKey)) {

            content.set(
                contentKey,
                []
            );
        }

        content
            .get(contentKey)
            .push(post);


        /*
         * Title
         */

        if(!title.has(titleKey)) {

            title.set(
                titleKey,
                []
            );
        }

        title
            .get(titleKey)
            .push(post);


        /*
         * Title + date
         */

        const key =
            titleKey +
            "|" +
            date;


        if(!titleDate.has(key)) {

            titleDate.set(
                key,
                []
            );
        }

        titleDate
            .get(key)
            .push(post);
    }


    return {
        content,
        title,
        titleDate
    };
}


/* =====================================================
COMPARE
===================================================== */

function compare(posts, indexes) {

    const result = [];


    for(
        let i = 0;
        i < posts.length;
        i++
    ) {

        const post =
            posts[i];


        /*
         * 1. Exact normalized content
         */

        const contentKey =
            simpleHash(
                normalizeContent(
                    post.content
                )
            );


        const contentMatches =
            indexes.content.get(
                contentKey
            );


        if(
            contentMatches &&
            contentMatches.length
        ) {

            result.push({

                xyz: post,

                abc:
                    contentMatches[0],

                method:
                    "EXACT CONTENT",

                confidence:
                    "100%"

            });

            updateProgress(
                i,
                posts.length
            );

            continue;
        }


        /*
         * 2. Title + date
         */

        const titleKey =
            normalizeTitle(
                post.title
            );


        const date =
            getDate(
                post.published
            );


        const titleDateKey =
            titleKey +
            "|" +
            date;


        const dateMatches =
            indexes.titleDate.get(
                titleDateKey
            );


        if(
            dateMatches &&
            dateMatches.length === 1
        ) {

            result.push({

                xyz: post,

                abc:
                    dateMatches[0],

                method:
                    "TITLE + DATE",

                confidence:
                    "98%"

            });

            updateProgress(
                i,
                posts.length
            );

            continue;
        }


        /*
         * 3. Exact title
         */

        const titleMatches =
            indexes.title.get(
                titleKey
            );


        if(
            titleMatches &&
            titleMatches.length === 1
        ) {

            result.push({

                xyz: post,

                abc:
                    titleMatches[0],

                method:
                    "EXACT TITLE",

                confidence:
                    "95%"

            });

            updateProgress(
                i,
                posts.length
            );

            continue;
        }


        updateProgress(
            i,
            posts.length
        );
    }


    return result;
}


/* =====================================================
DISPLAY
===================================================== */

function displayMatches() {

    const container =
        document.getElementById(
            "results"
        );


    if(!matches.length) {

        container.innerHTML =
            `
            <div class="controls">
                No duplicate posts found.
            </div>
            `;

        return;
    }


    /*
     * Render first 200 so browser
     * doesn't freeze.
     */

    const limit =
        Math.min(
            200,
            matches.length
        );


    let html = "";


    for(
        let i = 0;
        i < limit;
        i++
    ) {

        html +=
            renderMatch(
                matches[i],
                i + 1
            );
    }


    if(matches.length > 200) {

        html +=
            `
            <div class="controls">

                Showing first 200 matches.

                <br><br>

                Total:
                <strong>
                    ${matches.length.toLocaleString()}
                </strong>

                <br><br>

                Download CSV for all matches.

            </div>
            `;
    }


    container.innerHTML =
        html;
}


/* =====================================================
MATCH HTML
===================================================== */

function renderMatch(
    match,
    number
) {

    return `

<div class="match">


<div class="match-header">

Duplicate #${number}

&nbsp; | &nbsp;

${escape(match.method)}

&nbsp; | &nbsp;

${escape(match.confidence)}

</div>


<div class="columns">


<!-- XYZ -->

<div class="column">

<h2>
XYZ — TollyBoost
</h2>


<div class="title">

${escape(
    match.xyz.title
)}

</div>


<div class="date">

Published:
${escape(
    match.xyz.published
)}

</div>


<div class="url">

<strong>
XYZ URL:
</strong>

<br>

<a
href="${escapeAttr(
    match.xyz.url
)}"
target="_blank"
rel="noopener">

${escape(
    match.xyz.url
)}

</a>

</div>


${renderImages(
    match.xyz.images
)}


<h3>
XYZ Post HTML
</h3>


<pre>${escape(
    match.xyz.content
)}</pre>


</div>


<!-- ABC -->

<div class="column">

<h2>
ABC — TollywoodBoost
</h2>


<div class="title">

${escape(
    match.abc.title
)}

</div>


<div class="date">

Published:
${escape(
    match.abc.published
)}

</div>


<div class="url">

<strong>
ABC URL:
</strong>

<br>

<a
href="${escapeAttr(
    match.abc.url
)}"
target="_blank"
rel="noopener">

${escape(
    match.abc.url
)}

</a>

</div>


${renderImages(
    match.abc.images
)}


<h3>
ABC Post HTML
</h3>


<pre>${escape(
    match.abc.content
)}</pre>


</div>


</div>

</div>

`;
}


/* =====================================================
IMAGES
===================================================== */

function renderImages(images) {

    if(
        !images ||
        images.length === 0
    ) {

        return `
            <div class="images">
                <h3>Images</h3>
                No images.
            </div>
        `;
    }


    return `

<div class="images">

<h3>
Images (${images.length})
</h3>

${
    images
    .map(
        image => `

<div class="image">

<img
src="${escapeAttr(image)}"
loading="lazy"
onerror="
this.style.display='none';
"
>

<div class="image-url">

${escape(image)}

</div>

</div>

`
    )
    .join("")
}

</div>

`;
}


/* =====================================================
CSV
===================================================== */

function downloadCSV() {

    if(!matches.length) {
        return;
    }


    const rows = [

        [
            "XYZ URL",
            "ABC URL",
            "XYZ Title",
            "ABC Title",
            "XYZ Date",
            "ABC Date",
            "Match Method",
            "Confidence"
        ]

    ];


    for(
        const match of matches
    ) {

        rows.push([

            match.xyz.url,

            match.abc.url,

            match.xyz.title,

            match.abc.title,

            match.xyz.published,

            match.abc.published,

            match.method,

            match.confidence

        ]);
    }


    const csv =
        rows
        .map(
            row =>
                row
                .map(csvEscape)
                .join(",")
        )
        .join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        "blogger-duplicates.csv";


    document.body.appendChild(
        link
    );

    link.click();

    link.remove();


    URL.revokeObjectURL(
        url
    );
}


/* =====================================================
NORMALIZE CONTENT
===================================================== */

function normalizeContent(html) {

    let value =
        String(
            html || ""
        );


    /*
     * Remove scripts.
     */

    value =
        value.replace(
            /<script[\s\S]*?<\/script>/gi,
            ""
        );


    /*
     * Remove styles.
     */

    value =
        value.replace(
            /<style[\s\S]*?<\/style>/gi,
            ""
        );


    /*
     * IMPORTANT:
     * Blogger image URLs can be
     * different between blogs.
     *
     * Replace image URLs with
     * the image filename.
     */

    value =
        value.replace(
            /<img[^>]*>/gi,
            function(img) {

                const match =
                    img.match(
                        /src\s*=\s*["']([^"']+)["']/i
                    );


                if(!match) {
                    return "<image>";
                }


                const filename =
                    getImageFilename(
                        match[1]
                    );


                return (
                    "<image:" +
                    normalizeImageName(
                        filename
                    ) +
                    ">"
                );
            }
        );


    /*
     * Remove remaining HTML tags.
     */

    value =
        value.replace(
            /<[^>]+>/g,
            " "
        );


    /*
     * Decode common HTML entities.
     */

    value =
        value
        .replace(
            /&nbsp;/gi,
            " "
        )
        .replace(
            /&amp;/gi,
            "&"
        )
        .replace(
            /&quot;/gi,
            '"'
        );


    /*
     * Normalize whitespace.
     */

    value =
        value
        .toLowerCase()
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    return value;
}


/* =====================================================
IMAGE FILENAME
===================================================== */

function getImageFilename(url) {

    try {

        const clean =
            url.split("?")[0];

        const parts =
            clean.split("/");

        return decodeURIComponent(
            parts[parts.length - 1]
        );

    }
    catch {

        return url;
    }
}


function normalizeImageName(name) {

    return String(name || "")
        .toLowerCase()
        .replace(
            /\+/g,
            " "
        )
        .replace(
            /%20/g,
            " "
        )
        .replace(
            /%2520/g,
            " "
        )
        .replace(
            /%28/g,
            "("
        )
        .replace(
            /%29/g,
            ")"
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


/* =====================================================
TITLE
===================================================== */

function normalizeTitle(title) {

    return String(
        title || ""
    )
    .normalize("NFKC")
    .toLowerCase()
    .replace(
        /[^\p{L}\p{N}\s]/gu,
        " "
    )
    .replace(
        /\s+/g,
        " "
    )
    .trim();
}


/* =====================================================
HASH
===================================================== */

function simpleHash(value) {

    let hash = 0;

    for(
        let i = 0;
        i < value.length;
        i++
    ) {

        hash =
            (
                (
                    hash << 5
                ) -
                hash
            ) +
            value.charCodeAt(i);

        hash |= 0;
    }


    return String(hash);
}


/* =====================================================
DATE
===================================================== */

function getDate(value) {

    if(!value) {
        return "";
    }

    return String(
        value
    ).substring(
        0,
        10
    );
}


/* =====================================================
PROGRESS
===================================================== */

function updateProgress(
    current,
    total
) {

    const percent =
        Math.round(
            (
                (current + 1) /
                total
            ) *
            100
        );


    progress(
        percent
    );


    setStatus(
        "Comparing XYZ: " +
        (current + 1).toLocaleString() +
        " / " +
        total.toLocaleString()
    );
}


function progress(value) {

    document.getElementById(
        "progressBar"
    ).style.width =
        value + "%";
}


function setStatus(value) {

    document.getElementById(
        "status"
    ).textContent =
        value;
}


/* =====================================================
ESCAPE
===================================================== */

function escape(value) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttr(value) {

    return escape(
        value
    );
}


function csvEscape(value) {

    const text =
        String(
            value || ""
        );


    if(
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n") ||
        text.includes("\r")
    ) {

        return '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"';
    }


    return text;
}


function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}

</script>

</body>
</html>
