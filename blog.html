<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Latest Tollywood movie news, actress updates, celebrity photos and entertainment posts.">

<title>Tollywood Posts | Filmstars</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f7fb;
    color: #222;
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: auto;
}

header {
    background: #111827;
    color: white;
    padding: 20px 0;
}

.header-inner {

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 18px;
}

nav a:hover {
    text-decoration: underline;
}

.hero {
    text-align: center;
    padding: 45px 0 25px;
}

.hero h1 {
    margin: 0 0 12px;
    font-size: 36px;
}

.hero p {
    color: #666;
    line-height: 1.6;
}

.blog-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;

    padding:
        20px 0 40px;
}

.post-card {

    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.06);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.post-card:hover {

    transform:
        translateY(-4px);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.1);
}

.post-image {

    width: 100%;

    height: 220px;

    object-fit: cover;

    display: block;

    background: #eee;
}

.post-content {
    padding: 20px;
}

.post-title {

    margin: 0 0 10px;

    font-size: 20px;

    line-height: 1.4;
}

.post-title a {

    color: #111827;

    text-decoration: none;
}

.post-title a:hover {
    color: #2563eb;
}

.post-date {

    color: #777;

    font-size: 13px;

    margin-bottom: 12px;
}

.post-excerpt {

    color: #555;

    font-size: 15px;

    line-height: 1.6;

    margin-bottom: 18px;
}

.read-more {

    display: inline-block;

    padding:
        10px 16px;

    background:
        #2563eb;

    color: white;

    border-radius: 7px;

    text-decoration: none;

    font-size: 14px;

    font-weight: bold;
}

.read-more:hover {
    background: #1d4ed8;
}

.loading {

    text-align: center;

    padding: 60px 20px;

    color: #666;
}

.error {

    max-width: 700px;

    margin: 30px auto;

    padding: 20px;

    background: white;

    border:
        1px solid #fecaca;

    color: #991b1b;

    border-radius: 10px;

    text-align: center;
}


/* PAGINATION */

.pagination {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 8px;

    padding:
        10px 0 60px;
}

.pagination a,
.pagination span {

    min-width: 42px;

    height: 42px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        0 13px;

    border:
        1px solid #ddd;

    border-radius: 7px;

    background: white;

    color: #222;

    text-decoration: none;

    font-size: 14px;
}

.pagination a:hover {

    background: #2563eb;

    color: white;

    border-color:
        #2563eb;
}

.pagination .active {

    background:
        #2563eb;

    color: white;

    border-color:
        #2563eb;

    font-weight: bold;
}

.pagination .disabled {

    color: #aaa;

    background: #f5f5f5;

    cursor: default;
}

footer {

    background:
        #111827;

    color: #ccc;

    text-align: center;

    padding: 25px;
}

footer a {

    color: white;

    text-decoration: none;
}


@media (max-width: 900px) {

    .blog-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }

}


@media (max-width: 600px) {

    .header-inner {

        flex-direction: column;

        gap: 15px;

        text-align: center;
    }

    nav a {
        margin: 0 7px;
    }

    .hero h1 {
        font-size: 29px;
    }

    .blog-grid {
        grid-template-columns: 1fr;
    }

    .post-image {
        height: 210px;
    }

}

</style>

</head>


<body>


<header>

<div class="container header-inner">

    <div class="logo">
        Filmstars
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/blog">
            Blog
        </a>

    </nav>

</div>

</header>


<main>


<section class="hero">

<div class="container">

    <h1>
        Latest Tollywood Posts
    </h1>

    <p>
        Latest movie news, celebrity updates,
        actress photos and entertainment stories.
    </p>

</div>

</section>


<section class="container">


<div id="loading"
     class="loading">

    Loading posts...

</div>


<div id="error"
     class="error"
     style="display:none;">

</div>


<div id="posts"
     class="blog-grid">

</div>


<div id="pagination"
     class="pagination">

</div>


</section>


</main>


<footer>

    © <span id="year"></span> Filmstars

</footer>


<script>

document.getElementById("year")
    .textContent =
    new Date().getFullYear();


function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


function createPostCard(post) {

    const title =
        escapeHtml(post.title);

    const url =
        escapeHtml(post.url);

    const image =
        escapeHtml(post.image);

    const excerpt =
        escapeHtml(post.excerpt);

    const date =
        formatDate(post.published);


    return `

        <article class="post-card">

            ${
                image
                    ? `
                    <img
                        class="post-image"
                        src="${image}"
                        alt="${title}"
                        loading="lazy"
                    >
                    `
                    : `
                    <div
                        class="post-image"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:#777;
                        "
                    >
                        Filmstars
                    </div>
                    `
            }


            <div class="post-content">

                <h2 class="post-title">

                    <a href="${url}">

                        ${title}

                    </a>

                </h2>


                ${
                    date
                        ? `
                        <div class="post-date">

                            Published ${date}

                        </div>
                        `
                        : ""
                }


                <div class="post-excerpt">

                    ${excerpt}

                </div>


                <a
                    class="read-more"
                    href="${url}"
                >
                    Read More
                </a>

            </div>

        </article>

    `;

}


function createPageUrl(page) {

    if (page <= 1) {
        return "/blog";
    }

    return "/blog?page=" + page;
}


function addPagination(
    currentPage,
    totalPages
) {

    const container =
        document.getElementById(
            "pagination"
        );

    if (totalPages <= 1) {
        container.innerHTML = "";
        return;
    }


    let html = "";


    /*
     * Previous
     */

    if (currentPage > 1) {

        html += `

            <a href="${createPageUrl(
                currentPage - 1
            )}">

                ← Previous

            </a>

        `;

    } else {

        html += `

            <span class="disabled">

                ← Previous

            </span>

        `;

    }


    /*
     * Page numbers
     */

    let start =
        Math.max(
            1,
            currentPage - 2
        );

    let end =
        Math.min(
            totalPages,
            currentPage + 2
        );


    if (start > 1) {

        html += `

            <a href="${createPageUrl(1)}">
                1
            </a>

        `;

        if (start > 2) {

            html += `
                <span>...</span>
            `;

        }

    }


    for (
        let i = start;
        i <= end;
        i++
    ) {

        if (i === currentPage) {

            html += `

                <span class="active">
                    ${i}
                </span>

            `;

        } else {

            html += `

                <a href="${createPageUrl(i)}">
                    ${i}
                </a>

            `;

        }

    }


    if (end < totalPages) {

        if (end < totalPages - 1) {

            html += `
                <span>...</span>
            `;

        }

        html += `

            <a href="${createPageUrl(
                totalPages
            )}">

                ${totalPages}

            </a>

        `;

    }


    /*
     * Next
     */

    if (currentPage < totalPages) {

        html += `

            <a href="${createPageUrl(
                currentPage + 1
            )}">

                Next →

            </a>

        `;

    } else {

        html += `

            <span class="disabled">

                Next →

            </span>

        `;

    }


    container.innerHTML = html;
}


async function loadPosts() {

    const loading =
        document.getElementById(
            "loading"
        );

    const error =
        document.getElementById(
            "error"
        );

    const posts =
        document.getElementById(
            "posts"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    let page =
        parseInt(
            params.get("page") || "1",
            10
        );


    if (
        !Number.isFinite(page) ||
        page < 1
    ) {

        page = 1;

    }


    try {

        const response =
            await fetch(
                "/blogger-posts?page=" +
                page
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load posts."
            );

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !Array.isArray(data.posts)
        ) {

            throw new Error(
                "Invalid Blogger response."
            );

        }


        loading.style.display =
            "none";


        posts.innerHTML =
            data.posts
                .map(
                    createPostCard
                )
                .join("");


        addPagination(
            data.page,
            data.totalPages
        );


        /*
         * Update browser title.
         */

        document.title =
            "Tollywood Posts - Page " +
            data.page +
            " | Filmstars";


        /*
         * Scroll to top when
         * page loads.
         */

        window.scrollTo(
            0,
            0
        );


    } catch (errorObject) {

        console.error(
            errorObject
        );


        loading.style.display =
            "none";


        error.textContent =
            "Unable to load posts right now. Please try again later.";


        error.style.display =
            "block";

    }

}


loadPosts();

</script>


</body>

</html>
