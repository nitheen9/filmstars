<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Filmstars Blog</title>

<meta
    name="description"
    content="Latest celebrity and filmstar posts from Filmstars."
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.header {
    background: #fe5301;
    color: white;
}

.header-inner {
    width: 92%;
    max-width: 1200px;
    min-height: 68px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 36px;
    font-weight: bold;
}

.logo a {
    color: white;
    text-decoration: none;
}

.nav a {
    color: white;
    text-decoration: none;
    margin-left: 22px;
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: 35px auto 70px;
}

.page-title {
    margin: 0 0 8px;
    font-size: 36px;
}

.page-description {
    margin: 0 0 25px;
    color: #666;
}

.label-heading {
    display: inline-block;
    margin-bottom: 25px;
    padding: 8px 14px;
    background: #47164F;
    color: white;
    border-radius: 20px;
    font-size: 15px;
}

.posts-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
}

.post-card {
    overflow: hidden;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.05);
    transition: transform .15s ease, box-shadow .15s ease;
}

.post-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,.10);
}

.post-image-link {
    display: block;
    background: #f1f1f1;
}

.post-image {
    width: 100%;
    height: 380px;
    display: block;
    object-fit: contain;
    background: #f1f1f1;
}

.post-content {
    padding: 18px;
}

.post-title {
    margin: 0 0 10px;
    font-size: 20px;
    line-height: 1.4;
}

.post-title a {
    color: #222;
    text-decoration: none;
}

.post-date {
    color: #777;
    font-size: 13px;
    margin-bottom: 12px;
}

.post-excerpt {
    color: #555;
    line-height: 1.6;
    font-size: 14px;
    margin-bottom: 15px;
}

.read-more {
    display: inline-block;
    padding: 8px 13px;
    border-radius: 5px;
    background: #47164F;
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

.loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 10px;
    color: #666;
}

.error {
    grid-column: 1 / -1;
    background: white;
    padding: 25px;
    border-radius: 10px;
    border: 1px solid #fecaca;
    color: #b91c1c;
}

.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 40px;
}

.page-button {
    display: inline-block;
    border: 1px solid #d1d5db;
    background: white;
    color: #222;
    padding: 9px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
}

.page-button:hover {
    border-color: #2563eb;
    color: #2563eb;
}

.page-button.active {
    background: #47164F;
    color: white;
    border-color: #47164F;
}

.page-info {
    color: #666;
    font-size: 14px;
    margin: 0 8px;
}

.footer {
    background: #111827;
    color: #aaa;
    text-align: center;
    padding: 30px 15px;
}

@media(max-width:900px) {

    .posts-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width:600px) {

    .header-inner {
        padding: 17px 0;
    }

    .logo {
        font-size: 28px;
    }

    .container {
        width: 94%;
    }

    .page-title {
        font-size: 29px;
    }

    .posts-grid {
        grid-template-columns: 1fr;
    }

    .post-image {
        height: auto;
        max-height: 800px;
    }

}

</style>

</head>

<body>

<header class="header">

<div class="header-inner">

<div class="logo">

<a href="/">
Film Stars
</a>

</div>

<nav class="nav">

<a href="/">
Home
</a>

</nav>

</div>

</header>


<main class="container">

<h1
    id="pageTitle"
    class="page-title"
>
Filmstars Blog
</h1>

<p
    id="pageDescription"
    class="page-description"
>
Latest posts from Tollywood Boost
</p>

<div
    id="labelHeading"
    class="label-heading"
    style="display:none"
></div>

<div
    id="posts"
    class="posts-grid"
>

<div class="loading">
Loading posts...
</div>

</div>

<div
    id="pagination"
    class="pagination"
></div>

</main>


<footer class="footer">

© <span id="year"></span> Filmstars

</footer>


<script>

const API =
    "/blogger-posts";

const PER_PAGE =
    20;


const postsContainer =
    document.getElementById(
        "posts"
    );

const paginationContainer =
    document.getElementById(
        "pagination"
    );

const pageTitle =
    document.getElementById(
        "pageTitle"
    );

const pageDescription =
    document.getElementById(
        "pageDescription"
    );

const labelHeading =
    document.getElementById(
        "labelHeading"
    );


document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();


// ============================================================
// PARAMETERS
// ============================================================

function getParameters() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    let page =
        parseInt(
            params.get("page") ||
            "1",
            10
        );


    if (
        !Number.isFinite(page) ||
        page < 1
    ) {

        page = 1;
    }


    const label =
        (
            params.get("label") ||
            ""
        ).trim();


    return {
        page,
        label
    };
}


// ============================================================
// ESCAPE
// ============================================================

function escapeHtml(
    value
) {

    return String(
        value || ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


// ============================================================
// DATE
// ============================================================

function formatDate(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


// ============================================================
// EXCERPT
// ============================================================

function getExcerpt(
    html,
    max = 150
) {

    if (!html) {
        return "";
    }


    const div =
        document.createElement(
            "div"
        );


    div.innerHTML =
        html;


    const text =
        div.textContent ||
        div.innerText ||
        "";


    const clean =
        text
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    if (
        clean.length <= max
    ) {

        return clean;
    }


    return (
        clean.substring(
            0,
            max
        ).trim() +
        "..."
    );
}


// ============================================================
// CARD
// ============================================================

function createCard(
    post
) {

    const title =
        escapeHtml(
            post.title
        );


    const url =
        escapeHtml(
            post.url
        );


    const image =
        post.image
            ? escapeHtml(
                post.image
            )
            : "";


    return `

<article class="post-card">

<a
    class="post-image-link"
    href="${url}"
>

${
    image
        ? `

<img
    class="post-image"
    src="${image}"
    alt="${title}"
    loading="lazy"
    decoding="async"
>

`
        : ""
}

</a>


<div class="post-content">

<h2 class="post-title">

<a href="${url}">
${title}
</a>

</h2>


<div class="post-date">

${escapeHtml(
    formatDate(
        post.published
    )
)}

</div>


<div class="post-excerpt">

${escapeHtml(
    getExcerpt(
        post.content
    )
)}

</div>


<a
    class="read-more"
    href="${url}"
>
Read More
</a>

</div>

</article>

`;

}


// ============================================================
// PAGE URL
// ============================================================

function makePageUrl(
    page,
    label
) {

    const params =
        new URLSearchParams();


    if (label) {

        params.set(
            "label",
            label
        );
    }


    if (page > 1) {

        params.set(
            "page",
            String(page)
        );
    }


    const query =
        params.toString();


    return (
        "/blog" +
        (
            query
                ? "?" + query
                : ""
        )
    );
}


// ============================================================
// PAGINATION
// ============================================================

function createPagination(
    currentPage,
    totalPages,
    label
) {

    paginationContainer.innerHTML =
        "";


    if (
        totalPages <= 1
    ) {

        return;
    }


    // Previous

    if (
        currentPage > 1
    ) {

        const previous =
            document.createElement(
                "a"
            );


        previous.className =
            "page-button";


        previous.href =
            makePageUrl(
                currentPage - 1,
                label
            );


        previous.textContent =
            "← Previous";


        paginationContainer.appendChild(
            previous
        );
    }


    // Page numbers

    let start =
        Math.max(
            1,
            currentPage - 2
        );


    let end =
        Math.min(
            totalPages,
            currentPage + 2
        );


    if (
        currentPage <= 3
    ) {

        end =
            Math.min(
                totalPages,
                5
            );
    }


    if (
        currentPage >=
        totalPages - 2
    ) {

        start =
            Math.max(
                1,
                totalPages - 4
            );
    }


    if (
        start > 1
    ) {

        const first =
            document.createElement(
                "a"
            );


        first.className =
            "page-button";


        first.href =
            makePageUrl(
                1,
                label
            );


        first.textContent =
            "1";


        paginationContainer.appendChild(
            first
        );


        if (
            start > 2
        ) {

            const dots =
                document.createElement(
                    "span"
                );


            dots.className =
                "page-info";


            dots.textContent =
                "...";


            paginationContainer.appendChild(
                dots
            );
        }
    }


    for (
        let i = start;
        i <= end;
        i++
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.className =
            "page-button";


        link.href =
            makePageUrl(
                i,
                label
            );


        link.textContent =
            String(i);


        if (
            i === currentPage
        ) {

            link.classList.add(
                "active"
            );
        }


        paginationContainer.appendChild(
            link
        );
    }


    if (
        end < totalPages
    ) {

        if (
            end < totalPages - 1
        ) {

            const dots =
                document.createElement(
                    "span"
                );


            dots.className =
                "page-info";


            dots.textContent =
                "...";


            paginationContainer.appendChild(
                dots
            );
        }


        const last =
            document.createElement(
                "a"
            );


        last.className =
            "page-button";


        last.href =
            makePageUrl(
                totalPages,
                label
            );


        last.textContent =
            String(totalPages);


        paginationContainer.appendChild(
            last
        );
    }


    // Next

    if (
        currentPage <
        totalPages
    ) {

        const next =
            document.createElement(
                "a"
            );


        next.className =
            "page-button";


        next.href =
            makePageUrl(
                currentPage + 1,
                label
            );


        next.textContent =
            "Next →";


        paginationContainer.appendChild(
            next
        );
    }


    // Info

    const info =
        document.createElement(
            "span"
        );


    info.className =
        "page-info";


    info.textContent =
        `Page ${currentPage} of ${totalPages}`;


    paginationContainer.appendChild(
        info
    );
}


// ============================================================
// LOAD
// ============================================================

async function loadPosts() {

    const {
        page,
        label
    } =
        getParameters();


    // --------------------------------------------------------
    // Header
    // --------------------------------------------------------

    if (label) {

        pageTitle.textContent =
            label;


        pageDescription.textContent =
            "Posts published under the " +
            label +
            " label.";


        labelHeading.textContent =
            "Label: " +
            label;


        labelHeading.style.display =
            "inline-block";


        document.title =
            label +
            " - Filmstars Blog";

    } else {

        pageTitle.textContent =
            "Filmstars Blog";


        pageDescription.textContent =
            "Latest posts from Tollywood Boost";


        labelHeading.style.display =
            "none";


        document.title =
            "Filmstars Blog";
    }


    postsContainer.innerHTML = `

<div class="loading">
Loading posts...
</div>

`;


    paginationContainer.innerHTML =
        "";


    // --------------------------------------------------------
    // API URL
    // --------------------------------------------------------

    const apiUrl =
        new URL(
            API,
            window.location.origin
        );


    apiUrl.searchParams.set(
        "page",
        String(page)
    );


    apiUrl.searchParams.set(
        "max-results",
        String(PER_PAGE)
    );


    if (label) {

        apiUrl.searchParams.set(
            "label",
            label
        );
    }


    console.log(
        "Filmstars API:",
        apiUrl.toString()
    );


    try {

        const response =
            await fetch(
                apiUrl.toString(),
                {
                    method:
                        "GET",

                    cache:
                        "no-store",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        console.log(
            "Filmstars API data:",
            data
        );


        if (
            !data ||
            data.success !== true
        ) {

            throw new Error(
                data?.error ||
                "API returned an error"
            );
        }


        const posts =
            Array.isArray(
                data.posts
            )
                ? data.posts
                : [];


        if (
            posts.length === 0
        ) {

            postsContainer.innerHTML = `

<div class="loading">

No posts found
${
    label
        ? " for " +
          escapeHtml(label)
        : ""
}.

</div>

`;

            return;
        }


        postsContainer.innerHTML =
            posts
                .map(
                    createCard
                )
                .join("");


        const total =
            Number(
                data.total
            ) || 0;


        const totalPages =
            Number(
                data.totalPages
            ) ||
            (
                total > 0
                    ? Math.ceil(
                        total /
                        PER_PAGE
                    )
                    : 1
            );


        createPagination(
            page,
            totalPages,
            label
        );


    } catch (error) {

        console.error(
            "Filmstars Blogger error:",
            error
        );


        postsContainer.innerHTML = `

<div class="error">

<strong>
Unable to load posts right now.
</strong>

<br><br>

${escapeHtml(
    error.message
)}

<br><br>

<button
    class="page-button"
    onclick="loadPosts()"
>
Try Again
</button>

</div>

`;
    }
}


// ============================================================
// START
// ============================================================

loadPosts();

</script>

</body>

</html>
