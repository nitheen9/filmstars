<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Filmstars Blog
</title>

<meta
    name="description"
    content="Latest celebrity and filmstar posts from Filmstars."
>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f6f8;

    color: #222;

}


.header {

    background: #111827;

    color: white;

}


.header-inner {

    width: 92%;

    max-width: 1200px;

    min-height: 68px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.logo {

    font-size: 27px;

    font-weight: bold;

}


.nav a {

    color: white;

    text-decoration: none;

    margin-left: 22px;

}


.container {

    width: 92%;

    max-width: 1200px;

    margin: 35px auto 70px;

}


.page-title {

    margin:
        0 0 8px;

    font-size: 36px;

}


.page-description {

    margin:
        0 0 30px;

    color: #666;

}


.posts-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 24px;

}


.post-card {

    overflow: hidden;

    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 12px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.05);

    transition:
        transform .15s ease,
        box-shadow .15s ease;

}


.post-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.10);

}


.post-image-link {

    display: block;

    background: #f1f1f1;

}


.post-image {

    width: 100%;

    height: 350px;

    display: block;

    object-fit: contain;

    background: #f1f1f1;

}


.post-content {

    padding: 18px;

}


.post-title {

    margin:
        0 0 10px;

    font-size: 20px;

    line-height: 1.4;

}


.post-title a {

    color: #222;

    text-decoration: none;

}


.post-date {

    color: #777;

    font-size: 13px;

    margin-bottom: 12px;

}


.post-excerpt {

    color: #555;

    line-height: 1.6;

    font-size: 14px;

    margin-bottom: 15px;

}


.read-more {

    display: inline-block;

    padding:
        8px 13px;

    border-radius: 5px;

    background: #2563eb;

    color: white;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;

}


.loading {

    text-align: center;

    padding: 50px 10px;

    color: #666;

}


.error {

    background: white;

    padding: 25px;

    border-radius: 10px;

    border:
        1px solid #fecaca;

    color: #b91c1c;

}


.pagination {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 40px;

}


.page-button {

    border:
        1px solid #d1d5db;

    background: white;

    color: #222;

    padding:
        9px 14px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;

}


.page-button:hover {

    border-color:
        #2563eb;

    color:
        #2563eb;

}


.page-button.active {

    background:
        #2563eb;

    color: white;

    border-color:
        #2563eb;

}


.page-button:disabled {

    opacity: .45;

    cursor: not-allowed;

}


.page-info {

    color: #666;

    font-size: 14px;

    margin:
        0 8px;

}


.footer {

    background: #111827;

    color: #aaa;

    text-align: center;

    padding: 30px 15px;

}


@media (
    max-width: 900px
) {

    .posts-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


@media (
    max-width: 600px
) {

    .header-inner {

        padding:
            17px 0;

        flex-direction:
            column;

        gap: 14px;

    }


    .nav a {

        margin:
            0 8px;

    }


    .container {

        width: 94%;

    }


    .page-title {

        font-size: 29px;

    }


    .posts-grid {

        grid-template-columns:
            1fr;

    }


    .post-image {

        height: auto;

        max-height: 700px;

    }

}

</style>

</head>


<body>


<header class="header">

<div class="header-inner">

<div class="logo">
Filmstars
</div>


<nav class="nav">

<a href="/">
Home
</a>

<a href="/blog">
Blog
</a>

</nav>

</div>

</header>


<main class="container">


<h1 class="page-title">
Filmstars Blog
</h1>


<p class="page-description">
Latest posts from Tollywood Boost
</p>


<div
    id="posts"
    class="posts-grid"
>

<div class="loading">
Loading posts...
</div>

</div>


<div
    id="pagination"
    class="pagination"
>
</div>


</main>


<footer class="footer">

© <span id="year"></span> Filmstars

</footer>


<script>

const API =
    "/api/blogger";


const PER_PAGE =
    20;


const postsContainer =
    document.getElementById(
        "posts"
    );


const paginationContainer =
    document.getElementById(
        "pagination"
    );


document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();


// ======================================================
// GET PAGE
// ======================================================

function getPage() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const page =
        parseInt(
            params.get("page") || "1",
            10
        );


    return (
        Number.isFinite(page) &&
        page > 0
    )
        ? page
        : 1;
}


// ======================================================
// ESCAPE
// ======================================================

function escapeHtml(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


// ======================================================
// DATE
// ======================================================

function formatDate(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


// ======================================================
// EXCERPT
// ======================================================

function getExcerpt(
    html,
    max = 150
) {

    if (!html) {
        return "";
    }


    const div =
        document.createElement(
            "div"
        );


    div.innerHTML =
        html;


    const text =
        div.textContent ||
        div.innerText ||
        "";


    const clean =
        text
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    if (
        clean.length <= max
    ) {

        return clean;
    }


    return (
        clean.substring(
            0,
            max
        ).trim() +
        "..."
    );
}


// ======================================================
// CARD
// ======================================================

function createCard(post) {

    const title =
        escapeHtml(
            post.title
        );


    const url =
        escapeHtml(
            post.url
        );


    const image =
        post.image
            ? escapeHtml(
                post.image
            )
            : "";


    const date =
        escapeHtml(
            formatDate(
                post.published
            )
        );


    const excerpt =
        escapeHtml(
            getExcerpt(
                post.content
            )
        );


    return `

        <article class="post-card">


            <a
                class="post-image-link"
                href="${url}"
            >

                ${
                    image
                        ? `
                            <img
                                class="post-image"
                                src="${image}"
                                alt="${title}"
                                loading="lazy"
                            >
                          `
                        : ""
                }

            </a>


            <div class="post-content">


                <h2 class="post-title">

                    <a
                        href="${url}"
                    >
                        ${title}
                    </a>

                </h2>


                <div class="post-date">

                    ${date}

                </div>


                <div class="post-excerpt">

                    ${excerpt}

                </div>


                <a
                    class="read-more"
                    href="${url}"
                >
                    Read More
                </a>


            </div>

        </article>

    `;
}


// ======================================================
// PAGINATION
// ======================================================

function createPagination(
    currentPage,
    total
) {

    paginationContainer.innerHTML =
        "";


    const totalPages =
        Math.ceil(
            total /
            PER_PAGE
        );


    if (
        totalPages <= 1
    ) {

        return;
    }


    // Previous
    const previous =
        document.createElement(
            "button"
        );


    previous.className =
        "page-button";


    previous.textContent =
        "← Previous";


    previous.disabled =
        currentPage <= 1;


    previous.onclick =
        function() {

            if (
                currentPage > 1
            ) {

                goToPage(
                    currentPage - 1
                );

            }

        };


    paginationContainer.appendChild(
        previous
    );


    // Page numbers
    let start =
        Math.max(
            1,
            currentPage - 2
        );


    let end =
        Math.min(
            totalPages,
            currentPage + 2
        );


    if (
        currentPage <= 3
    ) {

        end =
            Math.min(
                totalPages,
                5
            );

    }


    if (
        currentPage >=
        totalPages - 2
    ) {

        start =
            Math.max(
                1,
                totalPages - 4
            );

    }


    for (
        let page = start;
        page <= end;
        page++
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-button";


        if (
            page === currentPage
        ) {

            button.classList.add(
                "active"
            );

        }


        button.textContent =
            page;


        button.onclick =
            function() {

                goToPage(
                    page
                );

            };


        paginationContainer.appendChild(
            button
        );

    }


    // Next
    const next =
        document.createElement(
            "button"
        );


    next.className =
        "page-button";


    next.textContent =
        "Next →";


    next.disabled =
        currentPage >= totalPages;


    next.onclick =
        function() {

            if (
                currentPage <
                totalPages
            ) {

                goToPage(
                    currentPage + 1
                );

            }

        };


    paginationContainer.appendChild(
        next
    );


    const info =
        document.createElement(
            "span"
        );


    info.className =
        "page-info";


    info.textContent =
        `Page ${currentPage} of ${totalPages}`;


    paginationContainer.insertBefore(
        info,
        paginationContainer.children[
            Math.min(
                3,
                paginationContainer.children.length
            )
        ]
    );

}


// ======================================================
// GO TO PAGE
// ======================================================

function goToPage(page) {

    const url =
        new URL(
            window.location.href
        );


    if (
        page <= 1
    ) {

        url.searchParams.delete(
            "page"
        );

    } else {

        url.searchParams.set(
            "page",
            page
        );

    }


    window.location.href =
        url.toString();
}


// ======================================================
// LOAD POSTS
// ======================================================

async function loadPosts() {

    const page =
        getPage();


    const startIndex =
        (
            (page - 1) *
            PER_PAGE
        ) + 1;


    postsContainer.innerHTML = `

        <div class="loading">

            Loading posts...

        </div>

    `;


    try {

        const response =
            await fetch(

                `${API}` +
                `?start-index=${startIndex}` +
                `&max-results=${PER_PAGE}`,

                {
                    cache:
                        "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to load posts"
            );

        }


        const posts =
            Array.isArray(
                data.posts
            )
                ? data.posts
                : [];


        if (
            posts.length === 0
        ) {

            postsContainer.innerHTML = `

                <div class="loading">

                    No posts found.

                </div>

            `;


            paginationContainer.innerHTML =
                "";


            return;
        }


        postsContainer.innerHTML =
            posts
                .map(
                    createCard
                )
                .join("");


        createPagination(
            page,
            Number(data.total) ||
            posts.length
        );


        window.scrollTo(
            {
                top: 0,
                behavior: "smooth"
            }
        );


    } catch (error) {

        console.error(
            "Filmstars Blogger error:",
            error
        );


        postsContainer.innerHTML = `

            <div class="error">

                <strong>
                    Unable to load posts right now.
                </strong>

                <br><br>

                Please try again in a few seconds.

                <br><br>

                <button
                    class="page-button"
                    onclick="loadPosts()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


loadPosts();

</script>


</body>

</html>
