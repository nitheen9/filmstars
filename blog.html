<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Tollywood Posts | Filmstars
</title>

<meta
    name="description"
    content="Latest Tollywood and Indian actress posts from Filmstars."
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f5f6f8;

    color:
        #222;
}

.header {
    background:
        #111827;

    color:
        white;
}

.header-inner {
    width:
        92%;

    max-width:
        1250px;

    margin:
        auto;

    min-height:
        68px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}

.logo {
    font-size:
        27px;

    font-weight:
        700;
}

.nav a {
    color:
        white;

    text-decoration:
        none;

    margin-left:
        22px;

    font-size:
        15px;
}

.nav a:hover {
    color:
        #93c5fd;
}

.page-header {
    width:
        92%;

    max-width:
        1250px;

    margin:
        35px auto 25px;
}

.page-header h1 {
    margin:
        0 0 10px;

    font-size:
        34px;
}

.page-header p {
    margin:
        0;

    color:
        #666;
}

.posts-container {
    width:
        92%;

    max-width:
        1250px;

    margin:
        auto auto 40px;
}

.posts-grid {
    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        24px;
}

.post-card {
    background:
        white;

    border:
        1px solid #e5e7eb;

    border-radius:
        12px;

    overflow:
        hidden;

    box-shadow:
        0 3px 14px
        rgba(0,0,0,.06);
}

.post-image-link {
    display:
        block;

    background:
        #f1f1f1;
}

.post-card-image {

    width:
        100%;

    /*
     * Tall enough for portrait photos.
     * contain prevents face/body cropping.
     */

    height:
        400px;

    display:
        block;

    object-fit:
        contain;

    background:
        #f1f1f1;
}

.post-content {
    padding:
        17px;
}

.post-title {
    margin:
        0 0 8px;

    font-size:
        18px;

    line-height:
        1.4;
}

.post-title a {
    color:
        #222;

    text-decoration:
        none;
}

.post-title a:hover {
    color:
        #2563eb;
}

.post-date {
    color:
        #777;

    font-size:
        12px;

    margin-bottom:
        11px;
}

.post-excerpt {
    color:
        #555;

    font-size:
        14px;

    line-height:
        1.55;
}

.read-more {
    display:
        inline-block;

    margin-top:
        13px;

    padding:
        8px 13px;

    background:
        #2563eb;

    color:
        white;

    border-radius:
        6px;

    text-decoration:
        none;

    font-size:
        13px;

    font-weight:
        bold;
}

.read-more:hover {
    background:
        #1d4ed8;
}

.loading {
    width:
        100%;

    text-align:
        center;

    padding:
        50px;

    color:
        #777;
}

.pagination {
    width:
        92%;

    max-width:
        1250px;

    margin:
        35px auto 65px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    gap:
        7px;

    flex-wrap:
        wrap;
}

.pagination a,
.pagination span {

    min-width:
        40px;

    height:
        40px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        0 12px;

    border:
        1px solid #ddd;

    border-radius:
        6px;

    background:
        white;

    color:
        #222;

    text-decoration:
        none;

    font-size:
        14px;
}

.pagination a:hover {
    background:
        #2563eb;

    color:
        white;

    border-color:
        #2563eb;
}

.pagination .active {

    background:
        #2563eb;

    color:
        white;

    border-color:
        #2563eb;

    font-weight:
        bold;
}

.footer {
    background:
        #111827;

    color:
        #aaa;

    text-align:
        center;

    padding:
        28px 15px;
}

@media (max-width: 1100px) {

    .posts-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media (max-width: 800px) {

    .posts-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .post-card-image {
        height:
            380px;
    }

}

@media (max-width: 600px) {

    .header-inner {
        min-height:
            auto;

        padding:
            17px 0;

        flex-direction:
            column;

        gap:
            14px;
    }

    .nav a {
        margin:
            0 8px;
    }

    .page-header h1 {
        font-size:
            28px;
    }

    .posts-grid {
        grid-template-columns:
            1fr;
    }

    .post-card-image {

        height:
            auto;

        max-height:
            700px;

        object-fit:
            contain;
    }

}

</style>

</head>

<body>

<header class="header">

<div class="header-inner">

    <div class="logo">
        Filmstars
    </div>

    <nav class="nav">

        <a href="/">
            Home
        </a>

        <a href="/blog">
            Blog
        </a>

    </nav>

</div>

</header>


<section class="page-header">

    <h1>
        Latest Tollywood Posts
    </h1>

    <p>
        Latest movie news, celebrity updates, actress photos and entertainment stories.
    </p>

</section>


<main class="posts-container">

    <div
        id="posts"
        class="posts-grid"
    >

        <div class="loading">
            Loading posts...
        </div>

    </div>

</main>


<div
    id="pagination"
    class="pagination"
>
</div>


<footer class="footer">

    © <span id="year"></span> Filmstars

</footer>


<script>

const BLOG_FEED =
    "https://tollywoodboost.blogspot.com/feeds/posts/default";


const PER_PAGE = 20;


function getText(value) {

    return value && value.$t
        ? value.$t
        : "";

}


function getBloggerUrl(entry) {

    if (!Array.isArray(entry.link)) {
        return "";
    }

    const link =
        entry.link.find(
            x => x.rel === "alternate"
        );

    return link
        ? link.href
        : "";

}


function filmstarsUrl(url) {

    try {

        const u =
            new URL(url);

        const m =
            u.pathname.match(
                /^\/(\d{4})\/(\d{2})\/(.+)\.html$/
            );

        if (!m) {
            return url;
        }

        return (
            "/" +
            m[1] +
            "/" +
            m[2] +
            "/" +
            m[3] +
            ".html"
        );

    } catch {

        return url;

    }

}


function largeImage(url) {

    if (!url) {
        return "";
    }

    return url

        .replace(
            /\/s72-c\//g,
            "/s800/"
        )

        .replace(
            /\/s72\//g,
            "/s800/"
        )

        .replace(
            /\/w72-h72-p-k-no-nu\//g,
            "/s800/"
        );

}


function getImage(entry) {

    if (
        entry.media$thumbnail &&
        entry.media$thumbnail.url
    ) {

        return largeImage(
            entry.media$thumbnail.url
        );

    }


    const content =
        getText(entry.content);

    const match =
        content.match(
            /<img[^>]+src=["']([^"']+)["']/i
        );

    return match
        ? largeImage(match[1])
        : "";

}


function plainText(html) {

    return (html || "")

        .replace(
            /<script[\s\S]*?<\/script>/gi,
            ""
        )

        .replace(
            /<style[\s\S]*?<\/style>/gi,
            ""
        )

        .replace(
            /<[^>]+>/g,
            " "
        )

        .replace(
            /&nbsp;/gi,
            " "
        )

        .replace(
            /&amp;/gi,
            "&"
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


function escapeHtml(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function dateText(value) {

    if (!value) {
        return "";
    }

    const d =
        new Date(value);

    if (isNaN(d.getTime())) {
        return "";
    }

    return d.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


function createCard(entry) {

    const title =
        getText(entry.title);

    const bloggerUrl =
        getBloggerUrl(entry);

    const url =
        filmstarsUrl(
            bloggerUrl
        );

    const image =
        getImage(entry);

    const content =
        plainText(
            getText(entry.content)
        );

    const excerpt =
        content.length > 130
            ? content.substring(0, 130) + "..."
            : content;

    const date =
        dateText(
            getText(entry.published)
        );


    return `

    <article class="post-card">

        <a
            class="post-image-link"
            href="${escapeHtml(url)}"
        >

            ${
                image
                    ? `
                    <img
                        class="post-card-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(title)}"
                        loading="lazy"
                        decoding="async"
                    >
                    `
                    : ""
            }

        </a>


        <div class="post-content">

            <h2 class="post-title">

                <a
                    href="${escapeHtml(url)}"
                >
                    ${escapeHtml(title)}
                </a>

            </h2>


            ${
                date
                    ? `
                    <div class="post-date">
                        ${escapeHtml(date)}
                    </div>
                    `
                    : ""
            }


            <div class="post-excerpt">

                ${escapeHtml(excerpt)}

            </div>


            <a
                class="read-more"
                href="${escapeHtml(url)}"
            >
                Read More
            </a>

        </div>

    </article>

    `;

}


function pageLink(
    page,
    current
) {

    if (page === current) {

        return `
            <span class="active">
                ${page}
            </span>
        `;

    }

    return `
        <a href="/blog?page=${page}">
            ${page}
        </a>
    `;

}


function renderPagination(
    current,
    total
) {

    const container =
        document.getElementById(
            "pagination"
        );

    if (total <= 1) {

        container.innerHTML = "";

        return;
    }


    let html = "";


    if (current > 1) {

        html += `
            <a href="/blog?page=${current - 1}">
                ← Previous
            </a>
        `;

    }


    const start =
        Math.max(
            1,
            current - 2
        );

    const end =
        Math.min(
            total,
            current + 2
        );


    if (start > 1) {

        html += pageLink(
            1,
            current
        );

        if (start > 2) {

            html += `
                <span>...</span>
            `;

        }

    }


    for (
        let i = start;
        i <= end;
        i++
    ) {

        html += pageLink(
            i,
            current
        );

    }


    if (end < total) {

        if (end < total - 1) {

            html += `
                <span>...</span>
            `;

        }

        html += pageLink(
            total,
            current
        );

    }


    if (current < total) {

        html += `
            <a href="/blog?page=${current + 1}">
                Next →
            </a>
        `;

    }


    container.innerHTML =
        html;

}


async function loadBlog() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    let page =
        parseInt(
            params.get("page") || "1",
            10
        );

    if (
        !Number.isFinite(page) ||
        page < 1
    ) {
        page = 1;
    }


    const start =
        ((page - 1) * PER_PAGE) + 1;


    const posts =
        document.getElementById(
            "posts"
        );


    try {

        /*
         * Get exactly this page.
         */

        const response =
            await fetch(
                BLOG_FEED +
                "?alt=json" +
                "&start-index=" +
                start +
                "&max-results=" +
                PER_PAGE
            );


        if (!response.ok) {

            throw new Error(
                "Blogger feed error"
            );

        }


        const data =
            await response.json();


        const entries =
            Array.isArray(
                data.feed?.entry
            )
                ? data.feed.entry
                : [];


        if (!entries.length) {

            posts.innerHTML =
                `
                <div class="loading">
                    No posts found.
                </div>
                `;

            return;
        }


        posts.innerHTML =
            entries
                .map(createCard)
                .join("");


        const total =
            Number(
                data.feed
                    ?.openSearch$totalResults
                    ?.$t
            ) || entries.length;


        const totalPages =
            Math.max(
                1,
                Math.ceil(
                    total / PER_PAGE
                )
            );


        renderPagination(
            page,
            totalPages
        );


        document.title =
            page > 1
                ? `Tollywood Posts - Page ${page} | Filmstars`
                : "Tollywood Posts | Filmstars";


    } catch (error) {

        console.error(error);

        posts.innerHTML =
            `
            <div class="loading">
                Unable to load posts right now.
            </div>
            `;

    }

}


document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();


loadBlog();

</script>

</body>
</html>
