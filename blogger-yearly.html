<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
TollyBoost Yearly Post URL Scanner
</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: #fe5301;
    color: #fff;
    padding: 24px 20px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

header p {
    margin: 0;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
}

.panel {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.year-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.year-button {
    border: 0;
    border-radius: 7px;
    background: #fe5301;
    color: #fff;
    padding: 14px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.year-button:hover {
    opacity: .9;
}

.year-button.running {
    background: #555;
}

.year-button.done {
    background: #198754;
}

.year-button:disabled {
    opacity: .65;
    cursor: not-allowed;
}

.actions {
    margin-top: 18px;
}

.action-button {
    border: 0;
    border-radius: 7px;
    background: #222;
    color: #fff;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 8px;
}

.action-button:disabled {
    opacity: .5;
}

#status {
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.5;
}

.progress {
    margin-top: 15px;
    height: 20px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #fe5301;
    transition: width .2s;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: #fff;
    padding: 18px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.stat strong {
    display: block;
    font-size: 27px;
    margin-bottom: 5px;
}

.stat span {
    color: #666;
    font-size: 13px;
}

.results-header {
    background: #222;
    color: #fff;
    padding: 14px 18px;
    border-radius: 8px 8px 0 0;
    font-weight: bold;
}

.url-list {
    background: #fff;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.url-row {
    padding: 12px 15px;
    border-bottom: 1px solid #eee;
    word-break: break-all;
}

.url-row:last-child {
    border-bottom: 0;
}

.url-row a {
    color: #06c;
}

.title {
    color: #444;
    margin-bottom: 5px;
    font-weight: bold;
}

.url {
    font-size: 13px;
}

.empty {
    background: #fff;
    padding: 40px;
    text-align: center;
    border-radius: 10px;
}

.error {
    background: #fff;
    padding: 20px;
    border-left: 5px solid #b42318;
    border-radius: 8px;
}

@media(max-width:900px) {

    .year-grid {
        grid-template-columns: repeat(3,1fr);
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width:600px) {

    .year-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .stats {
        grid-template-columns: 1fr;
    }
}

</style>

</head>


<body>


<header>

<h1>
TollyBoost Yearly Post URL Scanner
</h1>

<p>
Find all individual post URLs by year
</p>

</header>


<div class="container">


<div class="panel">

<h2>
Choose Year
</h2>

<p>
Click a year to scan TollyBoost posts whose
URLs begin with that year.
</p>


<div
    id="yearGrid"
    class="year-grid">
</div>


<div class="actions">

<button
    id="csvButton"
    class="action-button"
    onclick="downloadCSV()"
    disabled>
Download CSV
</button>

</div>


<div id="status">
Ready. Select a year.
</div>


<div class="progress">

<div id="progressBar">
</div>

</div>

</div>


<div class="stats">

<div class="stat">

<strong id="yearCount">
0
</strong>

<span>
Selected Year
</span>

</div>


<div class="stat">

<strong id="postCount">
0
</strong>

<span>
Post URLs Found
</span>

</div>


<div class="stat">

<strong id="scanYear">
-
</strong>

<span>
Year
</span>

</div>

</div>


<div id="results">

<div class="empty">

Select a year above.

</div>

</div>


</div>


<script>


const START_YEAR =
    2010;

const END_YEAR =
    2026;

const PAGE_SIZE =
    150;

const MAX_RETRIES =
    5;

const REQUEST_DELAY =
    1800;


let currentYear =
    null;

let currentPosts =
    [];


/* =====================================================
   CREATE YEAR BUTTONS
===================================================== */

createYearButtons();


function createYearButtons() {

    const grid =
        document.getElementById(
            "yearGrid"
        );


    for (
        let year =
            START_YEAR;
        year <=
            END_YEAR;
        year++
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "year-button";


        button.id =
            "year-" +
            year;


        button.textContent =
            year;


        button.addEventListener(
            "click",
            function() {

                scanYear(
                    year
                );
            }
        );


        grid.appendChild(
            button
        );
    }
}


/* =====================================================
   SCAN YEAR
===================================================== */

async function scanYear(
    year
) {

    currentYear =
        year;

    currentPosts =
        [];


    disableButtons(
        true
    );


    markRunning(
        year
    );


    document.getElementById(
        "csvButton"
    ).disabled =
        true;


    document.getElementById(
        "results"
    ).innerHTML =
        "";


    setProgress(
        0
    );


    document.getElementById(
        "yearCount"
    ).textContent =
        year;


    document.getElementById(
        "postCount"
    ).textContent =
        "0";


    document.getElementById(
        "scanYear"
    ).textContent =
        year;


    try {

        let position =
            1;


        const seen =
            new Set();


        while(true) {


            const data =
                await fetchYearPage(
                    year,
                    position
                );


            const posts =
                data.posts || [];


            if (
                posts.length === 0
            ) {

                break;
            }


            let newPosts =
                0;


            for (
                const post
                of posts
            ) {

                if (
                    !seen.has(
                        post.id ||
                        post.url
                    )
                ) {

                    seen.add(
                        post.id ||
                        post.url
                    );

                    currentPosts.push(
                        post
                    );

                    newPosts++;
                }
            }


            /*
             * Stop if Blogger begins
             * returning the same page.
             */

            if (
                newPosts === 0
            ) {

                break;
            }


            position +=
                posts.length;


            setStatus(
                "Scanning " +
                year +
                ": " +
                currentPosts.length.toLocaleString() +
                " post URLs found..."
            );


            document.getElementById(
                "postCount"
            ).textContent =
                currentPosts.length
                    .toLocaleString();


            /*
             * The progress is approximate
             * because we don't know the
             * exact yearly total until
             * the feed ends.
             */

            setProgress(
                Math.min(
                    95,
                    (
                        currentPosts.length /
                        1000
                    ) * 100
                )
            );


            await sleep(
                REQUEST_DELAY
            );


            if (
                position >
                100000
            ) {

                throw new Error(
                    "Safety limit reached."
                );
            }
        }


        /*
         * Sort by URL.
         */

        currentPosts.sort(
            function(a,b) {

                return a.url.localeCompare(
                    b.url
                );
            }
        );


        renderResults();


        document.getElementById(
            "csvButton"
        ).disabled =
            currentPosts.length === 0;


        markDone(
            year
        );


        setProgress(
            100
        );


        setStatus(
            "Finished " +
            year +
            ": " +
            currentPosts.length.toLocaleString() +
            " post URLs found."
        );

    }
    catch(error) {

        showError(
            error.message
        );

    }
    finally {

        disableButtons(
            false
        );
    }
}


/* =====================================================
   FETCH YEAR PAGE WITH RETRIES
===================================================== */

async function fetchYearPage(
    year,
    start
) {

    let lastError =
        null;


    for (
        let attempt = 1;
        attempt <=
        MAX_RETRIES;
        attempt++
    ) {

        try {

            const cacheBust =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2);


            const apiUrl =
                "/api/blogger-yearly" +
                "?year=" +
                encodeURIComponent(
                    year
                ) +
                "&start=" +
                start +
                "&v=" +
                encodeURIComponent(
                    cacheBust
                );


            const response =
                await fetch(
                    apiUrl,
                    {
                        method:
                            "GET",

                        cache:
                            "no-store",

                        headers: {
                            "Cache-Control":
                                "no-cache"
                        }
                    }
                );


            const contentType =
                response.headers.get(
                    "content-type"
                ) || "";


            if (
                !contentType
                    .toLowerCase()
                    .includes(
                        "application/json"
                    )
            ) {

                const text =
                    await response.text();


                throw new Error(
                    "API returned HTML instead of JSON. " +
                    "HTTP " +
                    response.status +
                    ". " +
                    text.substring(
                        0,
                        120
                    )
                );
            }


            const data =
                await response.json();


            if (
                !response.ok ||
                data.success !== true
            ) {

                throw new Error(
                    data.error ||
                    "Year scan failed."
                );
            }


            return data;

        }
        catch(error) {

            lastError =
                error;


            if (
                attempt >=
                MAX_RETRIES
            ) {

                break;
            }


            const wait =
                attempt *
                5000;


            setStatus(
                "Temporary error for " +
                year +
                ". Retry " +
                (
                    attempt + 1
                ) +
                "/" +
                MAX_RETRIES +
                " after " +
                (
                    wait / 1000
                ) +
                " seconds..."
            );


            await sleep(
                wait
            );
        }
    }


    throw (
        lastError ||
        new Error(
            "Unable to scan year."
        )
    );
}


/* =====================================================
   DISPLAY
===================================================== */

function renderResults() {

    const container =
        document.getElementById(
            "results"
        );


    if (
        currentPosts.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                No TollyBoost post URLs found for
                ${currentYear}.
            </div>
        `;

        return;
    }


    let html = `

<div class="results-header">

TollyBoost posts for
${currentYear}

—
${currentPosts.length.toLocaleString()}
URLs

</div>

<div class="url-list">

`;


    for (
        let i = 0;
        i < currentPosts.length;
        i++
    ) {

        const post =
            currentPosts[i];


        html += `

<div class="url-row">

<div class="title">

${i + 1}.
${escapeHTML(
    post.title || ""
)}

</div>

<div class="url">

<a
href="${escapeAttribute(
    post.url
)}"
target="_blank"
rel="noopener"
>

${escapeHTML(
    post.url
)}

</a>

</div>

</div>

`;
    }


    html += `
</div>
`;


    container.innerHTML =
        html;
}


/* =====================================================
   CSV
===================================================== */

function downloadCSV() {

    if (
        currentPosts.length === 0
    ) {

        return;
    }


    const rows = [

        [
            "Year",
            "Title",
            "TollyBoost URL",
            "Published"
        ]

    ];


    for (
        const post
        of currentPosts
    ) {

        rows.push([

            currentYear,

            post.title || "",

            post.url || "",

            post.published || ""

        ]);
    }


    const csv =
        rows
            .map(
                row =>
                    row
                        .map(
                            csvEscape
                        )
                        .join(",")
            )
            .join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "tollyboost-" +
        currentYear +
        "-post-urls.csv";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );
}


/* =====================================================
   BUTTON STATE
===================================================== */

function disableButtons(
    disabled
) {

    document
        .querySelectorAll(
            ".year-button"
        )
        .forEach(
            button =>
                button.disabled =
                    disabled
        );


    document.getElementById(
        "rebuildButton"
    ).disabled =
        disabled;
}


function markRunning(
    year
) {

    document
        .querySelectorAll(
            ".year-button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "running"
                )
        );


    const button =
        document.getElementById(
            "year-" +
            year
        );


    if (
        button
    ) {

        button.classList.add(
            "running"
        );
    }
}


function markDone(
    year
) {

    const button =
        document.getElementById(
            "year-" +
            year
        );


    if (
        button
    ) {

        button.classList.remove(
            "running"
        );


        button.classList.add(
            "done"
        );
    }
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text
) {

    document.getElementById(
        "status"
    ).textContent =
        text;
}


/* =====================================================
   PROGRESS
===================================================== */

function setProgress(
    value
) {

    document.getElementById(
        "progressBar"
    ).style.width =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        ) + "%";
}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
) {

    setStatus(
        "ERROR: " +
        message
    );


    document.getElementById(
        "results"
    ).innerHTML = `

<div class="error">

<strong>
Error
</strong>

<br><br>

${escapeHTML(
    message
)}

</div>

`;
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value || ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );
}


/* =====================================================
   CSV ESCAPE
===================================================== */

function csvEscape(
    value
) {

    const text =
        String(
            value || ""
        );


    if (
        /[",\r\n]/.test(
            text
        )
    ) {

        return '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"';
    }


    return text;
}


/* =====================================================
   SLEEP
===================================================== */

function sleep(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );
}

</script>

</body>

</html>
